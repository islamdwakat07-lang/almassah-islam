name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          mv app/build/outputs/apk/release/app-release.apk "almassah-islam-v${VER}.apk"
          cp "almassah-islam-v${VER}.apk" almassah-islam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: almassah-islam
          path: almassah-islam-v*.apk

      - name: Publish APK to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest almassah-islam.apk \
            --title "المساح إسلام (آخر نسخة)" \
            --notes "ملف APK جاهز للتثبيت على الأندرويد: حاسب الكواشين + الإفراز + حاسبة الجرف. تُحدَّث هذه النسخة تلقائياً مع كل تعديل." \
            --latest
