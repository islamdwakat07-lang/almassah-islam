plugins {
    id "com.android.application"
}

android {
    namespace "ps.islam.hisas"
    compileSdk 34

    defaultConfig {
        applicationId "ps.islam.almassah"
        minSdk 24
        targetSdk 34
        versionCode 112
        versionName "12.0"
    }

    signingConfigs {
        shared {
            storeFile file("hisas.keystore")
            storePassword "hisas2026"
            keyAlias "hisas"
            keyPassword "hisas2026"
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    androidResources {
        noCompress += ["js", "html"]
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "androidx.core:core:1.13.1"
    // أوراق المواطنين: تدوير صور الكاميرا + ماسح المستندات من Google
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1"
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
}
