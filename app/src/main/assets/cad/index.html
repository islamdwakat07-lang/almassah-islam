<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f3 = v => (Math.round(v * 1000) / 1000).toFixed(3), f2 = v => v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const numA = s => String(s).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/٫/g, ".").replace(/،/g, ",");
const KEY = "cad-v1";

/* =============================== الألوان ACI =============================== */
const ACI_BASE = { 1: "#ff3b30", 2: "#ffee33", 3: "#32e04a", 4: "#33e6e6", 5: "#3b6bff", 6: "#ff40ff", 7: "#f2f2f2", 8: "#8a8a8a", 9: "#c8c8c8" };
function aci(i) {
  i = Math.abs(i | 0);
  if (ACI_BASE[i]) return ACI_BASE[i];
  if (i >= 250) { const g = Math.round(51 + (i - 250) * 40.8); return `rgb(${g},${g},${g})`; }
  if (i < 10) return "#f2f2f2";
  const h = Math.floor((i - 10) / 10) * 15, k = i % 10, v = [1, 1, .8, .8, .65, .65, .5, .5, .35, .35][k], s = k % 2 ? .5 : 1;
  const f = n => { const kk = (n + h / 60) % 6; return Math.round(255 * (v - v * s * Math.max(0, Math.min(kk, 4 - kk, 1)))); };
  return `rgb(${f(5)},${f(3)},${f(1)})`;
}

/* =============================== DXF → عناصر =============================== */
function parseDXF(txt) {
  const L = txt.split(/\r?\n/), P = [];
  for (let i = 0; i + 1 < L.length; i += 2) P.push([parseInt(L[i], 10), L[i + 1].replace(/\s+$/, "")]);
  const layers = {}, blocks = {}, model = [];
  let sec = null, i = 0;
  const readEnt = () => { const e = { t: P[i][1], g: [] }; i++; while (i < P.length && P[i][0] !== 0) { e.g.push(P[i]); i++; } return e; };
  while (i < P.length) {
    const [c, v] = P[i];
    if (c === 0 && v === "SECTION") { sec = P[i + 1] && P[i + 1][1]; i += 2; continue; }
    if (c === 0 && v === "ENDSEC") { sec = null; i++; continue; }
    if (sec === "TABLES" && c === 0 && v === "LAYER") {
      const e = readEnt(); let n = "", col = 7; e.g.forEach(([k, x]) => { if (k === 2) n = x; if (k === 62) col = +x; });
      if (n) layers[n] = { c: Math.abs(col) || 7, on: col >= 0 }; continue;
    }
    if (sec === "BLOCKS" && c === 0 && v === "BLOCK") {
      const h = readEnt(); let name = "", bx = 0, by = 0; h.g.forEach(([k, x]) => { if (k === 2) name = x; if (k === 10) bx = +x; if (k === 20) by = +x; });
      const ents = [];
      while (i < P.length && !(P[i][0] === 0 && P[i][1] === "ENDBLK")) { if (P[i][0] === 0) ents.push(readEnt()); else i++; }
      if (i < P.length) readEnt();
      blocks[name] = { bx, by, ents: group(ents) }; continue;
    }
    if (sec === "ENTITIES" && c === 0) { model.push(readEnt()); continue; }
    i++;
  }
  return { layers, blocks, model: group(model) };
}
function group(list) {
  const out = []; let cur = null;
  for (const e of list) {
    if ((e.t === "VERTEX" || e.t === "ATTRIB") && cur) { cur.kids.push(e); continue; }
    if (e.t === "SEQEND") { cur = null; continue; }
    e.kids = []; out.push(e);
    cur = (e.t === "POLYLINE" || (e.t === "INSERT" && e.g.some(([k, v]) => k === 66 && +v === 1))) ? e : null;
  }
  return out;
}
const gv = (e, k, d) => { const p = e.g.find(x => x[0] === k); return p ? p[1] : d; };
const gn = (e, k, d = 0) => { const v = gv(e, k, null); return v == null ? d : +v; };
const uni = s => String(s).replace(/\\U\+([0-9A-Fa-f]{4})/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
const mtextPlain = s => uni(s).replace(/\\P/g, "\n").replace(/\\[ACcFfHhQTWp][^;]*;/g, "").replace(/\\[LlOoKkNn]/g, "").replace(/[{}]/g, "").replace(/\\S([^;]*);/g, "$1").replace(/%%[cC]/g, "Ø").replace(/%%[dD]/g, "°").replace(/%%[pP]/g, "±");

/* تحويل كتلة: p' = R·S·(p − base) + ins */
const T0 = { sx: 1, sy: 1, r: 0, bx: 0, by: 0, x: 0, y: 0 };
function tp(T, x, y) {
  const X = (x - T.bx) * T.sx, Y = (y - T.by) * T.sy, c = Math.cos(T.r), s = Math.sin(T.r);
  return [X * c - Y * s + T.x, X * s + Y * c + T.y];
}
function convert(D) {
  const out = [], seen = {};
  const layerOf = (e, pl) => { const l = gv(e, 8, "0"); return l === "0" && pl ? pl : l; };
  const colorOf = (e, pc) => { const c = gn(e, 62, 256); return c === 0 ? (pc == null ? 7 : pc) : c === 256 ? null : Math.abs(c); };
  function walk(list, X, pl, pc, depth) {
    const P = (x, y) => X ? X(x, y) : [x, y];
    const sc = X ? X.k : 1, rot = X ? X.rot : 0, mir = X ? X.mir : false;
    for (const e of list) {
      const ly = layerOf(e, pl), c = colorOf(e, pc), base = { ly, col: c };
      const ex = gn(e, 230, 1) < 0;  // OCS مقلوب
      const O = (x, y) => P(ex ? -x : x, y);
      try {
        switch (e.t) {
          case "LINE": out.push({ ...base, t: "L", p: [P(gn(e, 10), gn(e, 20)), P(gn(e, 11), gn(e, 21))], z: [gn(e, 30), gn(e, 31)] }); break;
          case "LWPOLYLINE": {
            const p = [], b = []; let cur = null;
            for (const [k, v] of e.g) { if (k === 10) { cur = [+v, 0]; p.push(cur); b.push(0); } else if (k === 20 && cur) cur[1] = +v; else if (k === 42 && cur) b[b.length - 1] = +v; }
            if (p.length < 2) break;
            const fl = (ex !== mir) ? -1 : 1;
            out.push({ ...base, t: "P", p: p.map(q => O(q[0], q[1])), b: b.map(x => x * fl), cl: !!(gn(e, 70) & 1), el: gn(e, 38) }); break;
          }
          case "POLYLINE": {
            const fl0 = gn(e, 70); if (fl0 & (16 | 64)) break;
            const vs = e.kids.filter(k => k.t === "VERTEX" && !(gn(k, 70) & 16));
            if (vs.length < 2) break;
            const fl = (ex !== mir) ? -1 : 1;
            out.push({ ...base, t: "P", p: vs.map(k => O(gn(k, 10), gn(k, 20))), b: vs.map(k => gn(k, 42) * fl), zz: vs.map(k => gn(k, 30)), cl: !!(fl0 & 1) }); break;
          }
          case "CIRCLE": out.push({ ...base, t: "C", c: O(gn(e, 10), gn(e, 20)), r: gn(e, 40) * sc }); break;
          case "ARC": {
            let a0 = gn(e, 50), a1 = gn(e, 51); if (ex) [a0, a1] = [180 - a1, 180 - a0];
            if (mir) [a0, a1] = [180 - a1, 180 - a0];
            out.push({ ...base, t: "A", c: O(gn(e, 10), gn(e, 20)), r: gn(e, 40) * sc, a0: a0 + rot, a1: a1 + rot }); break;
          }
          case "ELLIPSE": {
            const cx = gn(e, 10), cy = gn(e, 20), mx = gn(e, 11), my = gn(e, 21), ra = gn(e, 40, 1); let t0 = gn(e, 41, 0), t1 = gn(e, 42, 2 * Math.PI);
            if (t1 <= t0) t1 += 2 * Math.PI; const n = 64, p = [];
            for (let k = 0; k <= n; k++) { const t = t0 + (t1 - t0) * k / n, ct = Math.cos(t), st = Math.sin(t); p.push(P(cx + mx * ct - my * ra * st, cy + my * ct + mx * ra * st)); }
            out.push({ ...base, t: "P", p, b: p.map(() => 0), cl: false }); break;
          }
          case "SPLINE": {
            const pick = (kx, ky) => { const p = []; let cur = null; for (const [k, v] of e.g) { if (k === kx) { cur = [+v, 0]; p.push(cur); } else if (k === ky && cur) cur[1] = +v; } return p; };
            let p = pick(11, 21); if (p.length < 2) p = pick(10, 20); if (p.length < 2) break;
            out.push({ ...base, t: "P", p: p.map(q => P(q[0], q[1])), b: p.map(() => 0), cl: !!(gn(e, 70) & 1) }); break;
          }
          case "POINT": out.push({ ...base, t: "PT", p: P(gn(e, 10), gn(e, 20)), z: gn(e, 30) }); break;
          case "TEXT": case "ATTDEF": {
            if (e.t === "ATTDEF") break;
            const al = gn(e, 72) || gn(e, 73), x = al ? gn(e, 11, gn(e, 10)) : gn(e, 10), y = al ? gn(e, 21, gn(e, 20)) : gn(e, 20);
            const s = uni(gv(e, 1, "")); if (!s.trim()) break;
            out.push({ ...base, t: "T", p: P(x, y), h: gn(e, 40, 1) * sc, s, r: gn(e, 50) + rot, al: gn(e, 72), z: gn(e, 30) }); break;
          }
          case "MTEXT": {
            let s = ""; e.g.forEach(([k, v]) => { if (k === 3) s += v; }); s += gv(e, 1, "");
            s = mtextPlain(s); if (!s.trim()) break;
            let r = gn(e, 50); const dx = gn(e, 11, 0), dy = gn(e, 21, 0); if (dx || dy) r = Math.atan2(dy, dx) * 180 / Math.PI;
            out.push({ ...base, t: "T", p: P(gn(e, 10), gn(e, 20)), h: gn(e, 40, 1) * sc, s, r: r + rot, mt: 1 }); break;
          }
          case "DIMENSION": case "INSERT": {
            const name = gv(e, 2, ""), B = blocks[name]; if (!B || depth > 5) { if (e.t === "INSERT") out.push({ ...base, t: "X", p: P(gn(e, 10), gn(e, 20)), z: gn(e, 30), n: name }); break; }
            let X2;

$("#pBody").addEventListener("click", e => {

let exCSV = "";
function extractPanel() {
  const cnt = {}; D.ents.forEach(e => cnt[e.ly] = (cnt[e.ly] || 0) + 1);
  const ty = { PT: 0, X: 0, P: 0, L: 0, C: 0, T: 0 }; D.ents.forEach(e => { if (e.t in ty) ty[e.t]++; else if (e.t === "A") ty.C++; });
  showPanel(`<h3>📍 استخراج الإحداثيات من الملف</h3>

  <label class="chk"><input type="checkbox" data-ex="P" ${!ty.PT && !ty.X ? "checked" : ""}> رؤوس البوليلاين (${ty.P})</label>

  <details style="margin-top:6px"><summary style="font-weight:700;color:#0c3b26">الطبقات (${Object.keys(D.layers).length})</summary>
  ${Object.keys(D.layers).filter(n => cnt[n]).map(n => `<label class="chk"><input type="checkbox" data-exl="${esc(n)}" checked> <span class="n">${esc(n)}</span> <small>(${cnt[n]})</small></label>`).join("")}</details>
  <div class="pb"><button type="button" class="pri" data-act="exrun">استخرج</button></div><div id="exOut"></div>`);
}
function runExtract() {
  const T = new Set([...$("#pBody").querySelectorAll("[data-ex]:checked")].map(i => i.dataset.ex)), Ls = new Set([...$("#pBody").querySelectorAll("[data-exl]:checked")].map(i => i.dataset.exl));
  const rows = [], seen = new Set(); let n = 0;
  const add = (x, y, z, ly, typ, d) => { const key = x.toFixed(3) + "," + y.toFixed(3); if (typ !== "نص" && seen.has(key)) return; seen.add(key); rows.push([++n, f3(x), f3(y), f3(z || 0), ly, typ, d || ""]); };
  for (const e of D.ents) {
    if (!Ls.has(e.ly)) continue;
    if (e.t === "PT" && T.has("PT")) add(e.p[0], e.p[1], e.z, e.ly, "نقطة");
    if (e.t === "X" && T.has("X")) add(e.p[0], e.p[1], e.z, e.ly, "كتلة", e.n);
    if (e.t === "P" && T.has("P")) e.p.forEach((q, i) => add(q[0], q[1], e.zz ? e.zz[i] : e.el, e.ly, "رأس"));
    if (e.t === "L" && T.has("L")) e.p.forEach((q, i) => add(q[0], q[1], e.z ? e.z[i] : 0, e.ly, "نهاية خط"));
    if ((e.t === "C" || e.t === "A") && T.has("C")) add(e.c[0], e.c[1], 0, e.ly, "مركز");
    if (e.t === "T" && T.has("T")) add(e.p[0], e.p[1], e.z, e.ly, "نص", e.s.replace(/[\n,]/g, " "));
  }
  exCSV = "الرقم,X,Y,Z,الطبقة,النوع,الوصف\r\n" + rows.map(r => r.map(v => String(v).replace(/,/g, " ")).join(",")).join("\r\n");
  $("#exOut").innerHTML = rows.length ? `<p style="margin:8px 0 0;font-weight:700;color:#0c3b26">${rows.length} نقطة</p><table><thead><tr><th>#</th><th>X</th><th>Y</th><th>Z</th><th>الطبقة</th><th>الوصف</th></tr></thead><tbody>${rows.slice(0, 30).map(r => `<tr><td>${r[0]}</td><td class="m">${r[1]}</td><td class="m">${r[2]}</td><td class="m">${r[3]}</td><td class="m">${esc(r[4])}</td><td>${esc(r[6] || r[5])}</td></tr>`).join("")}</tbody></table>${rows.length > 30 ? `<p class="hint">… و${rows.length - 30} غيرها في الملف</p>` : ""}<div class="pb"><button type="button" class="pri" data-act="exsave">⬇ حفظ CSV</button><button type="button" data-act="excopy">نسخ (للصق في Excel)</button></div>` : '<p class="hint">لم أجد نقاطاً بهذه الخيارات.</p>';
}

/* =============================== الملفات =============================== */
const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
function saveText(name, txt, mime) {
  const u8 = new TextEncoder().encode(txt);
  if (window.AndroidBridge && AndroidBridge.saveFile) { AndroidBridge.saveFile(name, b64(u8), mime); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([u8], { type: mime })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function copy(t) { try { if (window.AndroidBridge && AndroidBridge.copy) AndroidBridge.copy(t); else navigator.clipboard.writeText(t); toast("نُسخ ✓"); } catch (e) { toast("تعذّر النسخ"); } }
let toastT; function toast(m) { const b = $("#busy"); $("#busyT").textContent = m; b.classList.add("on"); b.style.background = "transparent"; b.style.pointerEvents = "none"; $("#busyT").style.cssText = "background:rgba(12,59,38,.95);padding:10px 16px;border-radius:14px;border:1.5px solid #e6c35f;align-self:flex-start;margin-top:12px"; clearTimeout(toastT); toastT = setTimeout(() => { b.classList.remove("on"); b.style.cssText = ""; $("#busyT").style.cssText = ""; }, 1800); }
function busy(m) { const b = $("#busy"); b.style.cssText = ""; $("#busyT").style.cssText = ""; $("#busyT").textContent = m; b.classList.toggle("on", !!m); }

let eng = null;
async function dwg2dxf(u8) {
  if (!eng) { const { default: create } = await import("../dwg/lib/libredwg-web.js"); eng = await create({ locateFile: f => new URL("../dwg/lib/" + f, location.href).href }); }
  eng.FS.writeFile("/in.dwg", u8); let out = null;
  try { eng.dwg_write_dxf("/in.dwg", "/out.dxf"); out = eng.FS.readFile("/out.dxf"); } catch (e) { eng = null; }
  try { eng && eng.FS.unlink("/in.dwg"); eng && eng.FS.unlink("/out.dxf"); } catch (e) {}
  if (!out || !out.length) throw new Error("تعذّر قراءة ملف DWG هذا. احفظه من الأوتوكاد بصيغة DXF وافتحه.");
  return out;
}
function decode(u8) {
  let t = new TextDecoder("utf-8").decode(u8);
  if (t.includes("�")) { try { t = new TextDecoder("windows-1256").decode(u8); } catch (e) {} }
  return t;
}
async function openFile(f) {
  if (!f) return; $("#menu").classList.remove("on");
  busy("…جاري فتح " + f.name);
  try {
    await new Promise(r => setTimeout(r, 30));
    let u8 = new Uint8Array(await f.arrayBuffer());
    if (String.fromCharCode(...u8.subarray(0, 4)) === "AC10") { busy("…تحويل DWG (أول مرة تأخذ ثوانٍ)"); u8 = await dwg2dxf(u8); }
    const txt = decode(u8);
    if (/^AutoCAD Binary DXF/.test(txt)) throw new Error("ملف DXF ثنائي. احفظه بصيغة DXF نصية (ASCII).");
    const P = parseDXF(txt), R = convert(P);
    if (!R.ents.length) throw new Error("لم أجد رسومات في هذا الملف.");
    D = { name: f.name.replace(/\.(dwg|dxf)$/i, ""), t: Date.now(), ents: R.ents, layers: P.layers, cur: "0" };
    R.ents.forEach(e => ensureLayer(e.ly));
    undo = []; sel = null; coordList = []; paths = null; hideWelcome(); setTitle(); fit(); save(); setCmd("sel");
    busy(""); toast(`فُتح ${R.ents.length.toLocaleString("en")} عنصر · ${Object.keys(D.layers).length} طبقة`);
  } catch (e) { busy(""); alert(e.message || "تعذّر فتح الملف"); }
}

/* كتابة DXF (R12 بسيط يفتح في كل نسخ الأوتوكاد) */
function toDXF() {
  const o = [], w = (c, v) => o.push(c, v), n = v => (Math.round(v * 1e6) / 1e6).toString();
  const enc = s => String(s).replace(/[^\x20-\x7e]/g, ch => "\\U+" + ch.charCodeAt(0).toString(16).toUpperCase().padStart(4, "0"));
  w(0, "SECTION"); w(2, "HEADER"); w(9, "$ACADVER"); w(1, "AC1009"); w(9, "$INSUNITS"); w(70, 6); w(0, "ENDSEC");
  w(0, "SECTION"); w(2, "TABLES"); w(0, "TABLE"); w(2, "LAYER"); w(70, Object.keys(D.layers).length);
  for (const [nm, L] of Object.entries(D.layers)) { w(0, "LAYER"); w(2, enc(nm)); w(70, 0); w(62, (L.on === false ? -1 : 1) * (L.c || 7)); w(6, "CONTINUOUS"); }
  w(0, "ENDTAB"); w(0, "ENDSEC"); w(0, "SECTION"); w(2, "ENTITIES");
  const hd = (t, e) => { w(0, t); w(8, enc(e.ly || "0")); if (e.col != null) w(62, e.col); };
  for (const e of D.ents) {
    if (e.t === "L") { hd("LINE", e); w(10, n(e.p[0][0])); w(20, n(e.p[0][1])); w(30, n(e.z ? e.z[0] : 0)); w(11, n(e.p[1][0])); w(21, n(e.p[1][1])); w(31, n(e.z ? e.z[1] : 0)); }
    else if (e.t === "P") { hd("POLYLINE", e); w(66, 1); w(10, 0); w(20, 0); w(30, n(e.el || 0)); w(70, e.cl ? 1 : 0); e.p.forEach((q, i) => { w(0, "VERTEX"); w(8, enc(e.ly || "0")); w(10, n(q[0])); w(20, n(q[1])); w(30, n(e.zz ? e.zz[i] : 0)); if (e.b && e.b[i]) w(42, n(e.b[i])); }); w(0, "SEQEND"); w(8, enc(e.ly || "0")); }
    else if (e.t === "C") { hd("CIRCLE", e); w(10, n(e.c[0])); w(20, n(e.c[1])); w(30, 0); w(40, n(e.r)); }
    else if (e.t === "A") { hd("ARC", e); w(10, n(e.c[0])); w(20, n(e.c[1])); w(30, 0); w(40, n(e.r)); w(50, n(e.a0)); w(51, n(e.a1)); }
    else if (e.t === "PT" || e.t === "X") { hd("POINT", e); w(10, n(e.p[0])); w(20, n(e.p[1])); w(30, n(e.z || 0)); }
    else if (e.t === "T") { e.s.split("\n").forEach((ln, i) => { hd("TEXT", e); const dy = -i * e.h * 1.4; w(10, n(e.p[0])); w(20, n(e.p[1] + dy)); w(30, 0); w(40, n(e.h)); w(1, enc(ln)); if (e.r) w(50, n(e.r)); if (e.al) { w(72, e.al); w(11, n(e.p[0])); w(21, n(e.p[1] + dy)); w(31, 0); } }); }
  }
  w(0, "ENDSEC"); w(0, "EOF");
  let s = ""; for (let i = 0; i < o.length; i += 2) s += o[i] + "\r\n" + o[i + 1] + "\r\n"; return s;
}

const onResize = () => { const r = view.getBoundingClientRect(); if (Math.abs(r.width - W) < .5 && Math.abs(r.height - H) < .5) return; const w = s2w(W / 2, H / 2); resize(); tx = W / 2 - (w[0] - O[0]) * k; ty = H / 2 + (w[1] - O[1]) * k; redraw(); };
addEventListener("resize", onResize); try { new ResizeObserver(onResize).observe(view); } catch (e) {}
resize();

})();
