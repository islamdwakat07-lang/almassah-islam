<!doctype html>
<html lang="ar" dir="rtl" data-tool="meel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حاسبة الميل</title>
<link rel="stylesheet" href="../ifraz/fonts.css">
<link rel="stylesheet" href="../theme.css">
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
.tabs{display:flex;gap:6px;background:#f3ead2;border:1.5px solid var(--am-line);border-radius:999px;padding:4px;margin:4px 0 12px}
.tabs button{flex:1;border:0;border-radius:999px;background:none;padding:9px 4px;font:700 15px "IBM Plex Sans Arabic",Tahoma,sans-serif;color:var(--am-green-800);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--am-btn);color:#fff6d6;box-shadow:0 0 0 1.5px var(--am-gold-400)}
.card{background:var(--am-card);border:1.5px solid var(--am-line);border-radius:18px;padding:14px;box-shadow:0 10px 22px -16px rgba(8,42,27,.5),inset 0 1px 0 #fff;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px;color:var(--am-green-800);min-width:0}
label.f small{font-weight:500;color:var(--am-muted)}
input{font:500 18px "IBM Plex Mono",monospace;direction:ltr;text-align:left;padding:10px;border:1.5px solid var(--am-line);border-radius:12px;background:#fffdf6;color:var(--am-ink);width:100%;min-width:0}
input:focus{outline:2px solid var(--am-gold-500)}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.big div{background:#fffaf0;border:1.5px solid var(--am-line);border-radius:14px;padding:8px 10px;text-align:center}
.big b{display:block;font:700 24px "IBM Plex Mono",monospace;color:var(--am-green-800);direction:ltr}
.big span{font-size:13px;color:var(--am-muted)}
.big .main{grid-column:1/-1;background:var(--am-btn);border-color:var(--am-gold-500)}
.big .main b{color:#f3dc93;font-size:34px}.big .main span{color:#e7efe1}
.big .main .per{display:block;font:700 18px "IBM Plex Sans Arabic";color:#fff6d6;margin-top:2px}
.big .dz{grid-column:1/-1;background:#fde3e1;border-color:#d14b3f}.big .dz b{color:#b91c1c;font-size:28px}.big .dz span{color:#8a1c12}
.note{font-size:13px;color:var(--am-muted);margin:8px 0 0}
.warn{color:#9a3412;font-weight:700}
.ok{color:#1e6b4a;font-weight:700}
svg{display:block;width:100%;height:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th{background:var(--am-green-800);color:#f3dc93;padding:6px 4px;font-weight:700}
td{padding:4px;border-bottom:1px solid #eadfbf;text-align:center;font-family:"IBM Plex Mono",monospace}
td input{font-size:15px;padding:5px;text-align:center}
tr:nth-child(even) td{background:#fbf5e4}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:1.5px solid var(--am-gold-500);border-radius:999px;padding:9px;background:#fffaf0;color:var(--am-green-800);font:700 14px "IBM Plex Sans Arabic",Tahoma,sans-serif;cursor:pointer}
.btn.pri{background:var(--am-btn);color:#fff;border-color:var(--am-gold-400)}
.del{border:0;background:#f3ead2;color:#8a3b12;border-radius:50%;width:28px;height:28px;cursor:pointer}
.cut{color:#b91c1c}.fill{color:#1d4ed8}
.pane[hidden]{display:none}
</style>
</head>
<body>
<div class="am-bar"><span class="am-title"><img src="../img/t-meel.png" alt=""><b>حاسبة الميل</b></span><a class="am-home" href="../home.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2.5 11h2.7v9.5h5.3v-6h3v6h5.3V11h2.7z"/></svg>الرئيسية</a></div>
<div class="am-spacer" aria-hidden="true"></div>
<main>
  <div class="tabs" role="tablist">
    <button type="button" data-t="p" aria-selected="true">بين نقطتين</button>
    <button type="button" data-t="s" aria-selected="false">شارع</button>
    <button type="button" data-t="m" aria-selected="false">خط مجاري</button>
  </div>

  <!-- 1) between two points -->
  <section class="pane" id="pp">
    <div class="card">
      <div class="grid">
        <label class="f">منسوب النقطة الأولى<input id="z1" inputmode="decimal" value="512.40"></label>
        <label class="f">منسوب النقطة الثانية<input id="z2" inputmode="decimal" value="508.15"></label>
        <label class="f full">المسافة الأفقية بينهما (م)<input id="d" inputmode="decimal" value="85"></label>
      </div>
      <button class="btn" id="swap" type="button" style="width:100%;margin-top:8px">⇅ تبديل منسوب النقطة الأولى والثانية</button>
      <div class="big" id="pRes"></div>
      <svg id="pSvg" viewBox="0 0 340 120"></svg>
    </div>
    <div class="card">
      <b style="color:var(--am-green-800)">أريد ميلاً معيّناً</b>
      <div class="grid" style="margin-top:6px">
        <label class="f">الميل المطلوب %<input id="want" inputmode="decimal" value="4"></label>
        <label class="f">من منسوب<input id="wz" inputmode="decimal" value="512.40"></label>
        <label class="f full">بعد مسافة (م)<input id="wd" inputmode="decimal" value="85"></label>
      </div>
      <p class="note" id="wRes"></p>
    </div>
  </section>

  <!-- 2) street -->
  <section class="pane" id="ps" hidden>
    <div class="card">
      <div class="grid">
        <label class="f">منسوب بداية الشارع<input id="sz" inputmode="decimal" value="520.00"></label>
        <label class="f">الميل % <small>(سالب = نزول)</small><input id="sg" inputmode="decimal" value="-6"></label>
        <label class="f">طول الشارع (م)<input id="sl" inputmode="decimal" value="160"></label>
        <label class="f">كل كم متر محطة<input id="ss" inputmode="decimal" value="20"></label>
        <label class="f full">أقصى ميل مسموح % <small>(حسب البلدية، غيّره)</small><input id="smax" inputmode="decimal" value="12"></label>
      </div>
      <p class="note" id="sNote"></p>
      <svg id="sSvg" viewBox="0 0 340 150"></svg>
      <table><thead><tr><th>المحطة</th><th>منسوب التصميم</th><th>منسوب الأرض</th><th>حفر / ردم</th></tr></thead><tbody id="sBody"></tbody></table>
      <p class="note">اكتب منسوب الأرض عند كل محطة (من الرفع) فيظهر الحفر <span class="cut">بالأحمر</span> والردم <span class="fill">بالأزرق</span>.</p>
    </div>
  </section>

  <!-- 3) sewer -->
  <section class="pane" id="pm" hidden>
    <div class="card">
      <div class="grid">
        <label class="f">منسوب قاع أول منهل<input id="mz" inputmode="decimal" value="517.80"></label>
        <label class="f">ميل الخط %<input id="mg" inputmode="decimal" value="1.5"></label>
        <label class="f full">أقل ميل مسموح % <small>(حسب قطر الخط والبلدية، غيّره)</small><input id="mmin" inputmode="decimal" value="1"></label>
      </div>
      <table><thead><tr><th>المنهل</th><th>المسافة من السابق</th><th>منسوب الأرض</th><th>منسوب القاع</th><th>العمق</th><th></th></tr></thead><tbody id="mBody"></tbody></table>
      <div class="row"><button class="btn pri" id="mAdd" type="button">+ إضافة منهل</button></div>
      <p class="note" id="mNote"></p>
      <svg id="mSvg" viewBox="0 0 340 150"></svg>
    </div>
  </section>
</main>
<script>
"use strict";
const $ = s => document.querySelector(s);
const n = id => { const v = parseFloat(String($(id).value).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/٫|,/g, ".")); return isFinite(v) ? v : NaN; };
const f2 = v => isFinite(v) ? v.toFixed(2) : "—";
const KEY = "meel-v1";
let st = {}; try { st = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

/* tabs */
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  ["p", "s", "m"].forEach(t => $("#p" + t).hidden = t !== b.dataset.t); st.tab = b.dataset.t; save();
}));
if (st.tab) { const b = document.querySelector(`.tabs button[data-t="${st.tab}"]`); if (b) b.click(); }
// keep every typed value
document.querySelectorAll("main input[id]").forEach(i => { if (st["v_" + i.id] != null) i.value = st["v_" + i.id]; i.addEventListener("input", () => { st["v_" + i.id] = i.value; save(); }); });

/* 1) between two points */
function calcP() {
  const z1 = n("#z1"), z2 = n("#z2"), d = n("#d"), dz = z2 - z1, g = dz / d * 100, ang = Math.atan2(Math.abs(dz), d) * 180 / Math.PI, slope = Math.hypot(d, dz);
  const word = g > 0 ? "صعود" : g < 0 ? "نزول" : "مستوي", per = Math.abs(dz / d) * 100;
  $("#pRes").innerHTML = (d > 0 && isFinite(dz)) ?
    `<div class="main"><b>${g >= 0 ? "+" : ""}${g.toFixed(2)} %</b><span class="per">${g === 0 ? "مستوي" : `${word} <span style="direction:ltr;unicode-bidi:isolate;font:700 20px IBM Plex Mono,monospace;color:#f3dc93">${per.toFixed(2)}</span> سم لكل متر أفقي`}</span></div>
     <div class="dz"><b>${dz >= 0 ? "+" : ""}${dz.toFixed(2)} م</b><span>فرق المنسوب (${word})</span></div>
     <div><b>${(g * 10).toFixed(1)} ‰</b><span>بالألف</span></div><div><b>${ang.toFixed(2)}°</b><span>بالدرجات</span></div>
     <div><b>1:${Math.abs(dz) > 1e-9 ? (d / Math.abs(dz)).toFixed(1) : "∞"}</b><span>نسبة</span></div><div><b>${slope.toFixed(2)} م</b><span>المسافة المائلة (على الأرض)</span></div>` : '<p class="note">أدخل المنسوبين والمسافة.</p>';
  // little sketch
  const h = Math.max(-1, Math.min(1, dz / Math.max(d, 1) * 4)), y1 = 60 + 40 * h * .5 * (dz > 0 ? 1 : 1), yA = dz >= 0 ? 95 : 25, yB = dz >= 0 ? 95 - 70 * Math.min(1, Math.abs(h)) : 25 + 70 * Math.min(1, Math.abs(h));
  $("#pSvg").innerHTML = (d > 0 && isFinite(dz)) ? `<line x1="300" y1="${yA}" x2="40" y2="${yB}" stroke="#17613f" stroke-width="4" stroke-linecap="round"/>
    <line x1="300" y1="${yA}" x2="40" y2="${yA}" stroke="#c99a2e" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="40" y1="${yA}" x2="40" y2="${yB}" stroke="#c99a2e" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="300" cy="${yA}" r="6" fill="#0c3b26"/><circle cx="40" cy="${yB}" r="6" fill="#0c3b26"/>
    <text x="300" y="${yA + 20}" text-anchor="middle" font-size="12" fill="#1d2a22">1: ${f2(z1)}</text><text x="40" y="${yB + (dz >= 0 ? -10 : 20)}" text-anchor="middle" font-size="12" fill="#1d2a22">2: ${f2(z2)}</text>
    <text x="170" y="${yA + (dz >= 0 ? 16 : -6)}" text-anchor="middle" font-size="12" fill="#8a6514">${f2(d)} م</text>` : "";
  const w = n("#want"), wz = n("#wz"), wd = n("#wd");
  $("#wRes").innerHTML = isFinite(w) && isFinite(wz) && wd > 0 ? `منسوب النهاية = <b class="ok" style="font-family:IBM Plex Mono;direction:ltr;display:inline-block">${(wz + w / 100 * wd).toFixed(2)}</b> (فرق ${(w / 100 * wd).toFixed(2)} م)` : "";
}

/* 2) street */
function calcS() {
  const z0 = n("#sz"), g = n("#sg"), L = n("#sl"), step = n("#ss"), max = n("#smax");
  st.ground = st.ground || {};
  const rows = [];
  if (L > 0 && step > 0 && isFinite(z0) && isFinite(g)) { for (let c = 0; c <= L + 1e-6; c += step) rows.push(c); if (rows[rows.length - 1] < L - 1e-6) rows.push(L); }
  $("#sNote").innerHTML = isFinite(g) && isFinite(max) ? (Math.abs(g) > max ? `<span class="warn">⚠ الميل ${Math.abs(g)}% أكبر من الحد المسموح ${max}%.</span>` : `<span class="ok">✓ الميل ضمن الحد المسموح (${max}%).</span>`) + ` منسوب النهاية ${f2(z0 + g / 100 * L)}` : "";
  $("#sBody").innerHTML = rows.map(c => { const des = z0 + g / 100 * c, gr = parseFloat(st.ground[c]), dd = gr - des;
    return `<tr><td>${c.toFixed(0)}</td><td>${des.toFixed(2)}</td><td><input data-c="${c}" inputmode="decimal" value="${isFinite(gr) ? gr : ""}" placeholder="—"></td><td class="${isFinite(dd) ? (dd > 0 ? "cut" : "fill") : ""}">${isFinite(dd) ? (dd > 0 ? "حفر " : "ردم ") + Math.abs(dd).toFixed(2) : ""}</td></tr>`; }).join("");
  $("#sBody").querySelectorAll("input").forEach(i => i.addEventListener("change", () => { st.ground[i.dataset.c] = i.value; save(); calcS(); }));
  profile("#sSvg", rows.map(c => ({ x: c, d: z0 + g / 100 * c, g: parseFloat(st.ground[c]) })), "التصميم", "الأرض");
}

/* 3) sewer */
function calcM() {
  st.mh = st.mh && st.mh.length ? st.mh : [{ d: 0, g: 519.3 }, { d: 30, g: 518.9 }, { d: 35, g: 518.2 }, { d: 28, g: 517.0 }];
  const z0 = n("#mz"), g = n("#mg"), min = n("#mmin");
  let x = 0; const pts = st.mh.map((m, i) => { x += i ? (+m.d || 0) : 0; return { x, inv: z0 - g / 100 * x, gr: parseFloat(m.g) }; });
  $("#mBody").innerHTML = st.mh.map((m, i) => { const p = pts[i], dep = p.gr - p.inv;
    return `<tr><td>م${i + 1}</td><td>${i ? `<input data-i="${i}" data-k="d" inputmode="decimal" value="${m.d}">` : "—"}</td><td><input data-i="${i}" data-k="g" inputmode="decimal" value="${m.g}"></td><td>${p.inv.toFixed(2)}</td><td class="${dep < 1 ? "warn" : ""}">${isFinite(dep) ? dep.toFixed(2) : ""}</td><td>${i ? `<button class="del" data-del="${i}" type="button">✕</button>` : ""}</td></tr>`; }).join("");
  $("#mBody").querySelectorAll("input").forEach(i => i.addEventListener("change", () => { st.mh[+i.dataset.i][i.dataset.k] = i.value; save(); calcM(); }));
  $("#mBody").querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => { st.mh.splice(+b.dataset.del, 1); save(); calcM(); }));
  const shallow = pts.filter(p => p.gr - p.inv < 1).length;
  $("#mNote").innerHTML = (isFinite(g) && isFinite(min) ? (g < min ? `<span class="warn">⚠ ميل الخط ${g}% أقل من الحد ${min}%.</span> ` : `<span class="ok">✓ الميل ${g}% مقبول.</span> `) : "") +
    `طول الخط ${pts[pts.length - 1].x.toFixed(1)} م` + (shallow ? ` · <span class="warn">${shallow} منهل عمقه أقل من 1 م</span>` : "");
  profile("#mSvg", pts.map(p => ({ x: p.x, d: p.inv, g: p.gr })), "قاع الخط", "الأرض", true);
}
$("#swap").addEventListener("click", () => { const a = $("#z1").value, b = $("#z2").value; $("#z1").value = b; $("#z2").value = a; st.v_z1 = b; st.v_z2 = a; save(); all(); });
$("#mAdd").addEventListener("click", () => { const last = st.mh[st.mh.length - 1]; st.mh.push({ d: 30, g: last ? last.g : 0 }); save(); calcM(); });

/* simple longitudinal profile */
function profile(sel, pts, dLab, gLab, manholes) {
  if (pts.length < 2) { $(sel).innerHTML = ""; return; }
  const all = pts.flatMap(p => [p.d, p.g]).filter(isFinite), lo = Math.min(...all) - .5, hi = Math.max(...all) + .5, X0 = 34, X1 = 330, Y0 = 18, Y1 = 128, xmax = pts[pts.length - 1].x || 1;
  const X = x => X1 - (x / xmax) * (X1 - X0), Y = z => Y1 - (z - lo) / (hi - lo) * (Y1 - Y0);   // start on the right (Arabic reading)
  const line = (k, c, w, dash) => { const q = pts.filter(p => isFinite(p[k])); return q.length > 1 ? `<polyline points="${q.map(p => X(p.x).toFixed(1) + "," + Y(p[k]).toFixed(1)).join(" ")}" fill="none" stroke="${c}" stroke-width="${w}" ${dash ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round"/>` : ""; };
  let s = `<rect x="${X0}" y="${Y0}" width="${X1 - X0}" height="${Y1 - Y0}" fill="#fffaf0" stroke="#e2cf98"/>`;
  s += line("g", "#8a5a10", 2.5, true) + line("d", "#17613f", 3.5);
  if (manholes) pts.forEach((p, i) => { if (isFinite(p.g)) s += `<line x1="${X(p.x)}" y1="${Y(p.g)}" x2="${X(p.x)}" y2="${Y(p.d)}" stroke="#334155" stroke-width="6" opacity=".35"/><text x="${X(p.x)}" y="${Y(p.g) - 5}" text-anchor="middle" font-size="10" fill="#334155">م${i + 1}</text>`; });
  s += `<text x="${X0 - 4}" y="${Y0 + 8}" text-anchor="end" font-size="9" fill="#5d6458">${hi.toFixed(1)}</text><text x="${X0 - 4}" y="${Y1}" text-anchor="end" font-size="9" fill="#5d6458">${lo.toFixed(1)}</text>`;
  s += `<g font-size="11" direction="rtl"><line x1="${X1}" y1="${Y1 + 12}" x2="${X1 - 16}" y2="${Y1 + 12}" stroke="#17613f" stroke-width="3.5"/><text x="${X1 - 22}" y="${Y1 + 16}" text-anchor="start" fill="#1d2a22">${dLab}</text><line x1="${X1 - 110}" y1="${Y1 + 12}" x2="${X1 - 126}" y2="${Y1 + 12}" stroke="#8a5a10" stroke-width="2.5" stroke-dasharray="5 4"/><text x="${X1 - 132}" y="${Y1 + 16}" text-anchor="start" fill="#1d2a22">${gLab}</text></g>`;
  $(sel).setAttribute("viewBox", "0 0 340 150"); $(sel).innerHTML = s;
}

function all() { calcP(); calcS(); calcM(); }
document.querySelectorAll("main > section input[id]").forEach(i => i.addEventListener("input", all));
all();
</script>
</body>
</html>
