<!doctype html>
<html lang="ar" dir="rtl" data-tool="notes">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر العمل</title>
<link rel="stylesheet" href="../ifraz/fonts.css">
<link rel="stylesheet" href="../theme.css">
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif;background:#f8f2e2;color:var(--am-ink)}
main{max-width:640px;margin:0 auto;padding:10px 12px 40px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
.am-home{padding:4px 10px!important;font-size:12.5px!important;gap:4px!important}
.am-home svg{width:14px!important;height:14px!important}
/* تبويبان */
.views{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.views button{border:0;border-radius:14px;padding:10px 4px;font:700 16px "IBM Plex Sans Arabic";background:#fffdf6;color:var(--am-green-800);box-shadow:inset 0 0 0 1.5px var(--am-line)}
.views button.on{background:linear-gradient(160deg,#17613f,#0c3b26);color:#f3dc93;box-shadow:0 0 0 2px var(--am-gold-400)}
/* إضافة سريعة */
.quick{background:#fffdf6;border-radius:16px;padding:8px;box-shadow:inset 0 0 0 1.5px var(--am-line);display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.qrow{display:flex;gap:6px}
.qrow input{flex:1;min-width:0;font:500 16px "IBM Plex Sans Arabic";padding:9px 11px;border:1.5px solid var(--am-line);border-radius:12px;background:#fff}
.qrow input:focus{outline:2px solid var(--am-gold-500)}
.mic{flex:none;width:44px;border:0;border-radius:12px;font-size:19px;color:#fff;background:linear-gradient(160deg,#c0392b,#8e1f16)}
.mic.on{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.plus{flex:none;border:0;border-radius:12px;padding:0 16px;font:700 16px "IBM Plex Sans Arabic";color:#fff;background:var(--am-btn)}
.sub{display:flex;gap:6px;margin:6px 0}
.sub button{border:1.5px solid var(--am-line);background:#fffdf6;border-radius:999px;padding:4px 12px;font:700 13.5px "IBM Plex Sans Arabic";color:var(--am-green-800)}
.sub button.on{background:var(--am-btn);color:#fff;border-color:transparent}
.sub .sp{flex:1}
/* أسطر العمل */
.rows{background:#fffdf6;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--am-line);overflow:hidden}
.r{display:flex;align-items:center;gap:6px;padding:7px 8px;border-bottom:1px solid #eadfbf;min-height:52px}
.r:last-child{border-bottom:0}
.r .ck{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid #b9c4bb;background:#fff;font-size:16px;color:#fff;display:grid;place-items:center}
.r.done .ck{background:#2f8a4f;border-color:#2f8a4f}
.r{flex-direction:column;align-items:stretch!important}
.r .top{display:flex;align-items:flex-start;gap:6px}
.r .who{flex:1;min-width:0}
.r .nm{display:block;font:700 16px/1.45 "IBM Plex Sans Arabic";white-space:normal;word-break:break-word}
.r .wk{display:block;font-size:14px;color:#4a5a50;white-space:normal}
.r .lgm{display:block;font-size:12.5px;font-weight:700;margin-top:2px}.lgm.bad{color:#b4232c}.lgm.ok{color:#1e6b4a}
.st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:8px}
.st button{border:1.5px solid var(--am-line);background:#fffdf6;border-radius:10px;padding:6px 2px;font:700 12.5px/1.3 "IBM Plex Sans Arabic";color:#6b7368}
.st button.on[data-s=new]{background:#56677a;border-color:#56677a;color:#fff}
.st button.on[data-s=doing]{background:#c98a12;border-color:#c98a12;color:#fff}
.st button.on[data-s=done]{background:#1e6b4a;border-color:#1e6b4a;color:#fff}
.st button.on[data-s=paid]{background:#0d6f78;border-color:#0d6f78;color:#fff}
.r .fwrap{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.r .fwrap small{font-size:10.5px;color:var(--am-muted)}
.r.s-paid .nm,.r.s-paid .wk{color:#7d8a80}
.r .fee{flex:none;width:86px;font:700 14.5px "IBM Plex Sans Arabic";padding:6px;border:1.5px solid var(--am-line);border-radius:10px;background:#fff;text-align:center;direction:ltr}
.r .ib{flex:none;width:36px;height:36px;border:0;border-radius:10px;background:#f3ead2;font-size:16px;display:grid;place-items:center}
.r .day{display:block;font-size:11.5px;color:#8a5a00;font-weight:600}
.r .day.late{color:#b4232c}
.hrow{display:flex;gap:6px;padding:6px 8px;font:700 12.5px "IBM Plex Sans Arabic";color:var(--am-green-800);background:#f3ead2}
.empty{text-align:center;color:var(--am-muted);padding:26px 10px}
/* السجل المالي */
.frow{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:4px;align-items:center;padding:10px 8px;border-bottom:1px solid #eadfbf;cursor:pointer}
.frow:last-child{border-bottom:0}
.frow:active{background:#f6efd9}
.frow.h{background:#f3ead2;font:700 12.5px "IBM Plex Sans Arabic";color:var(--am-green-800);cursor:default;padding:7px 8px}
.frow .n{font:700 15px "IBM Plex Sans Arabic";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .v{font:700 14px "IBM Plex Sans Arabic";direction:ltr;text-align:center}
.frow .red{color:#b4232c}.frow .grn{color:#1e6b4a}
.frow.tot{background:#0c3b26;color:#f3dc93;cursor:default}
.frow.tot .v{color:#f3dc93;font-size:12.5px}
.repb{border:0;border-radius:12px;padding:6px 12px;font:700 13.5px "IBM Plex Sans Arabic";color:#0c3b26;background:linear-gradient(180deg,#f8e7a8,#e6c35f);box-shadow:0 0 0 1.5px #c99a2e}
/* الصفحات الداخلية */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,30,20,.45);display:flex;align-items:flex-end;justify-content:center}
.form{width:100%;max-width:640px;background:#fbf6e8;border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25);max-height:94vh;overflow:auto}
.form h3{margin:0 0 6px;font:700 19px var(--am-title);color:var(--am-green-800);display:flex;align-items:center;gap:8px}
.form h3 .x{margin-inline-start:auto;border:0;background:#f3ead2;border-radius:50%;width:36px;height:36px;font-size:16px;color:#8a3b12;flex:none}
.fl{display:block;font:700 14.5px "IBM Plex Sans Arabic";color:var(--am-green-800);margin:10px 2px 4px}
.in{display:flex;gap:8px}
.in input,.in textarea{flex:1;min-width:0;font:500 17px "IBM Plex Sans Arabic";padding:11px 13px;border:1.5px solid var(--am-line);border-radius:13px;background:#fffdf6;color:var(--am-ink)}
.in textarea{min-height:90px;resize:vertical;line-height:1.7}
.in input:focus,.in textarea:focus{outline:2px solid var(--am-gold-500);outline-offset:1px}
.in .mic{width:52px;border-radius:13px;font-size:22px}
.in .lnk{flex:none;width:48px;border-radius:13px;background:#f3ead2;display:grid;place-items:center;font-size:20px;text-decoration:none}
.days{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.dayb{border:1.5px solid var(--am-line);background:#fffdf6;border-radius:999px;padding:5px 13px;font:700 14px "IBM Plex Sans Arabic";color:var(--am-green-800)}
.dayb.on{background:var(--am-btn);color:#fff;border-color:transparent}
.save{width:100%;margin-top:14px;border:0;border-radius:15px;padding:13px;font:700 18px "IBM Plex Sans Arabic";color:#fff;background:var(--am-btn);box-shadow:0 0 0 1.5px var(--am-gold-400)}
.del{width:100%;margin-top:6px;border:0;border-radius:14px;padding:9px;font:700 14.5px "IBM Plex Sans Arabic";color:#a0302a;background:transparent}
.cur{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cur button{border:1.5px solid var(--am-line);background:#fffdf6;border-radius:12px;padding:8px 4px;font:700 15px "IBM Plex Sans Arabic";color:var(--am-green-800)}
.cur button.on{background:var(--am-btn);color:#fff;border-color:transparent}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.money div{background:#f6f1e0;border-radius:12px;padding:5px 6px;text-align:center;font-size:12.5px;color:var(--am-muted)}
.money b{display:block;font:700 15px "IBM Plex Sans Arabic";color:var(--am-ink);direction:ltr}
.money .rest b{color:#a0302a}.money .ok b{color:#1e6b4a}
.restbox{margin-top:10px;border-radius:14px;padding:11px;text-align:center;font:700 18px "IBM Plex Sans Arabic";background:linear-gradient(160deg,#17613f,#0c3b26);color:#f3dc93;box-shadow:0 0 0 1.5px var(--am-gold-400)}
.restbox.paid{background:linear-gradient(160deg,#2f8a4f,#1e6b4a);color:#fff}
.plist{font-size:14px}
.plist div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px dashed #e3d8b6}
.plist button{border:0;background:none;color:#a0302a;font-size:15px}
.sep{border:0;border-top:1.5px dashed var(--am-line);margin:14px 0 2px}
.secT{font:700 16px var(--am-title);color:#0d7f8a;margin:6px 2px 0}
.pt{display:flex;gap:8px}
.pt input{flex:1;min-width:0;font:500 17px "IBM Plex Sans Arabic";padding:10px 13px;border:1.5px solid var(--am-line);border-radius:13px;background:#fffdf6;text-align:left;direction:ltr}
.pt .mic{width:50px;border-radius:13px;font-size:20px}
.pt .ok{flex:none;width:50px;border:1.5px solid var(--am-line);border-radius:13px;background:#fffdf6;font-size:21px;color:#9aa49c}
.pt .ok.on{background:#2f8a4f;border-color:#2f8a4f;color:#fff}
.pname{font:500 15px "IBM Plex Sans Arabic";border:1.5px dashed var(--am-line);border-radius:12px;padding:6px 10px;background:#fffdf6;margin-bottom:5px;width:100%}
.dist{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.dist div{background:#eef6f5;border-radius:12px;padding:6px;text-align:center;font-size:12.5px;color:#356a6e}
.dist b{display:block;font:700 15px "IBM Plex Sans Arabic";color:#0b5f66;direction:ltr}
.pdf{width:100%;margin-top:12px;border:2px solid #0d7f8a;border-radius:15px;padding:11px;font:700 17px "IBM Plex Sans Arabic";color:#0d7f8a;background:#fffdf6}
/* الكشف اليومي */
.tot3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 4px}
.tot3 div{border-radius:14px;padding:8px 6px;text-align:center;font-size:12.5px;background:linear-gradient(160deg,#17613f,#0c3b26);color:#e7efe1}
.tot3 b{display:block;font:700 17px var(--am-title);color:#f3dc93;direction:ltr}
.rl{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.rl th{font-size:12.5px;color:var(--am-green-800);text-align:right;padding:5px 4px;border-bottom:1.5px solid var(--am-line)}
.rl td{padding:6px 4px;border-bottom:1px dashed #e3d8b6;vertical-align:top}
.rl td.n{direction:ltr;text-align:left;font-weight:700;white-space:nowrap}
.rl small{color:var(--am-muted)}
.dnav{display:flex;gap:6px;align-items:center}
.dnav button{flex:none;border:0;border-radius:12px;width:44px;height:44px;background:#f3ead2;font-size:18px;color:#0c3b26}
.dnav input{flex:1;font:600 16px "IBM Plex Sans Arabic";padding:10px;border:1.5px solid var(--am-line);border-radius:12px;background:#fffdf6;text-align:center}
.h4{font:700 15px var(--am-title);color:var(--am-green-800);margin:12px 2px 2px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#0c3b26;color:#fff6d6;padding:9px 18px;border-radius:999px;font-size:15px;z-index:90;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="am-bar"><span class="am-title"><img src="../img/t-notes.png" alt=""><b>دفتر العمل</b></span><a class="am-home" href="../home.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2.5 11h2.7v9.5h5.3v-6h3v6h5.3V11h2.7z"/></svg>الرئيسية</a></div>
<div class="am-spacer" aria-hidden="true"></div>
<main>
  <section id="vWork">
    <div class="quick">
      <div class="qrow"><input id="qName" placeholder="اسم صاحب العمل"><button class="mic" type="button" data-mic="qName">🎤</button></div>
      <div class="qrow"><input id="qWork" placeholder="نوع العمل (ترخيص، إخراج قيد، تفصيلي…)"><button class="mic" type="button" data-mic="qWork">🎤</button></div>
      <div class="qrow"><input id="qFee" inputmode="decimal" dir="ltr" placeholder="المبلغ المطلوب ₪" style="text-align:left"><button class="mic" type="button" data-mic="qFee">🎤</button><button class="plus" type="button" id="qAdd">＋ أضف</button></div>
    </div>
    <div class="sub" id="wSub"><button type="button" data-w="cur" class="on">الأعمال الحالية</button><button type="button" data-w="arch">🗄 الأرشيف</button></div>
    <div class="rows" id="wRows"></div>
  </section>

</main>

<!-- صفحة ملاحظات صاحب العمل -->
<div class="sheet hidden" id="noteSheet">
  <div class="form">
    <h3><span id="nT">ملاحظات</span><button class="x" type="button" data-close="noteSheet">✕</button></h3>
    <label class="fl">👤 الاسم</label>
    <div class="in"><input id="nName"><button class="mic" type="button" data-mic="nName">🎤</button></div>
    <label class="fl">🛠️ نوع العمل</label>
    <div class="in"><input id="nWork"><button class="mic" type="button" data-mic="nWork">🎤</button></div>
    <label class="fl">📞 رقم الهاتف</label>
    <div class="in"><input id="nPhone" inputmode="tel" dir="ltr" style="text-align:left"><button class="mic" type="button" data-mic="nPhone">🎤</button><a class="lnk" id="nCall">📞</a><a class="lnk" id="nWa">💬</a></div>
    <label class="fl">🗓️ اليوم</label>
    <div class="days" id="nDays"><button class="dayb" type="button" data-d="0">اليوم</button><button class="dayb" type="button" data-d="1">غداً</button><button class="dayb" type="button" data-d="2">بعد غد</button><button class="dayb" type="button" data-d="">بدون</button></div>
    <div class="in"><input id="nDate" type="date"><input id="nTime" type="time" style="max-width:40%"></div>
    <label class="fl">📝 الملاحظات</label>
    <div class="in"><textarea id="nNote" placeholder="اكتب أو اضغط الميكروفون"></textarea><button class="mic" type="button" data-mic="nNote">🎤</button></div>
    <button class="save" type="button" id="nSave">حفظ</button>
    <button class="del" type="button" id="nDel">🗑 حذف نهائي</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = t => { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 1800); };
const KEY = "jobs-v1";
let jobs = []; try { jobs = JSON.parse(localStorage.getItem(KEY) || "[]") || []; } catch (e) {}
jobs.forEach(j => { if (j.done == null) j.done = j.s === "done"; if (!["new", "doing", "done", "paid"].includes(j.s)) j.s = j.done ? "done" : "new"; });   // من النسخة السابقة
const STS = [["new", "جديد"], ["doing", "قيد العمل"], ["done", "انتهى العمل"], ["paid", "سُلّم واستُلم المبلغ"]], SORD = { doing: 0, new: 1, done: 2, paid: 3 };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(jobs)); } catch (e) {} };
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

/* ---------- المبالغ ---------- */
const N = s => { const v = parseFloat(String(s == null ? "" : s).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/٫/g, ".").replace(/[^\d.]/g, "")); return isFinite(v) ? v : 0; };
const M = v => (Math.round(v * 100) / 100).toLocaleString("en-US");
const CUR = { ils: "₪", jod: "د.أ", usd: "$" }, sym = j => CUR[(j && j.cur) || "ils"];
const MC = (v, j) => M(v) + " " + sym(j);
const PARTS = [["surv", "مبلغ المساحين"], ["draw", "مبلغ الرسامين"], ["law", "مبلغ المحامي"], ["reg", "مبلغ إخراج القيد"], ["oth", "مبلغ طرف آخر (إن وجد)"]];
const fee = j => N(j.fee), paid = j => (j.pays || []).reduce((t, p) => t + N(p.a), 0), rest = j => fee(j) - paid(j);
const partsSum = (parts, onlyPaid) => PARTS.reduce((t, [k]) => t + (parts && parts[k] && (!onlyPaid || parts[k].ok) ? N(parts[k].a) : 0), 0);
function sumCur(items) { const o = {}; items.forEach(([v, j]) => { const c = (j && j.cur) || "ils"; o[c] = (o[c] || 0) + v; }); const k = Object.keys(o).filter(c => o[c]); return k.length ? k.map(c => M(o[c]) + " " + CUR[c]).join(" · ") : "0"; }
function moneyHtml(f, p, j) { const r = f - p, S = " " + sym(j); return `<div><b>${M(f)}${S}</b>المطلوب</div><div class="ok"><b>${M(p)}${S}</b>الواصل</div><div class="${r > 0 ? "rest" : "ok"}"><b>${M(Math.abs(r))}${S}</b>${r > 0 ? "المتبقي" : r < 0 ? "زيادة" : "مدفوع كاملاً"}</div>`; }
function dayName(d) { if (!d) return ""; const t = ymd(new Date()), y = ymd(new Date(Date.now() - 864e5)), tm = ymd(new Date(Date.now() + 864e5)); if (d === t) return "اليوم"; if (d === y) return "أمس"; if (d === tm) return "غداً"; return new Date(d + "T00:00").toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long" }); }

/* ---------- ترتيب العمل: كل عمل بسطر ---------- */
let wSub = "cur";
$("#wSub").addEventListener("click", e => { const b = e.target.closest("[data-w]"); if (!b) return; wSub = b.dataset.w; document.querySelectorAll("#wSub button").forEach(x => x.classList.toggle("on", x === b)); render(); });
function render() { renderWork(); const n = jobs.filter(j => j.arch && !j.finOnly).length; $('#wSub [data-w="arch"]').textContent = "🗄 الأرشيف" + (n ? " (" + n + ")" : ""); }
function renderWork() {
  const arch = wSub === "arch";
  let list = jobs.filter(j => !j.finOnly && !!j.arch === arch);
  list.sort((a, b) => SORD[a.s] - SORD[b.s] || ((a.date || "9999") + (a.time || "")).localeCompare((b.date || "9999") + (b.time || "")) || a.t - b.t);
  if (!list.length) { $("#wRows").innerHTML = `<div class="empty">${arch ? "الأرشيف فارغ." : "لا أعمال بعد. اكتب الاسم ونوع العمل والمبلغ فوق (أو بصوتك) واضغط «أضف»."}</div>`; return; }
  const today = ymd(new Date());
  $("#wRows").innerHTML = list.map(j => {
    const d = j.date ? `<span class="day${j.date < today && SORD[j.s] < 2 ? " late" : ""}">🗓️ ${esc(dayName(j.date))}${j.time ? " " + esc(j.time) : ""}</span>` : "";
    const r = lgOfJob(j); let lm = "";
    if (r && N(r.due)) { const rem = N(r.due) - N(r.paid); lm = rem > 0 ? `<span class="lgm bad">💰 واصل ${M(N(r.paid))} · متبقي ${M(rem)} ₪</span>` : `<span class="lgm ok">💰 مدفوع كاملاً ✓</span>`; }
    return `<div class="r s-${j.s}" data-id="${j.id}">
      <div class="top"><div class="who"><span class="nm">${esc(j.name || "—")}</span>${j.work ? `<span class="wk">${esc(j.work)}</span>` : ""}${d}${lm}</div>
      <div class="fwrap"><input class="fee" inputmode="decimal" value="${esc(j.fee || "")}" placeholder="المبلغ ₪" data-fee><small>المطلوب</small></div>
      <button class="ib" type="button" data-note title="التفاصيل والملاحظات">📝</button>
      <button class="ib" type="button" data-arch title="${arch ? "إرجاع من الأرشيف" : "أرشفة"}">${arch ? "↩" : "🗄"}</button></div>
      <div class="st">${STS.map(([k, t]) => `<button type="button" data-s="${k}" class="${j.s === k ? "on" : ""}">${t}</button>`).join("")}</div></div>`;
  }).join("");
}
$("#qAdd").addEventListener("click", () => {
  const name = $("#qName").value.trim(), work = $("#qWork").value.trim(); if (!name && !work) { toast("اكتب الاسم أو نوع العمل"); return; }
  const fee = $("#qFee").value.trim(), j = { id: newId(), t: Date.now(), name, work, fee, s: "new", done: false, cur: "ils" }; jobs.push(j); save();
  if (N(fee)) syncLedger(j).then(ok => { render(); if (ok) toast("أُضيف، والمبلغ رحل للسجل المالي"); });
  $("#qName").value = ""; $("#qWork").value = ""; $("#qFee").value = ""; if (wSub !== "cur") $('#wSub [data-w="cur"]').click(); else render(); toast("أُضيف");
});
$("#wRows").addEventListener("click", e => {
  const r = e.target.closest("[data-id]"); if (!r) return; const j = jobs.find(x => x.id === r.dataset.id);
  const sb = e.target.closest("[data-s]"); if (sb) { setStatus(j, sb.dataset.s); return; }
  else if (e.target.closest("[data-arch]")) { j.arch = !j.arch; save(); render(); toast(j.arch ? "🗄 نُقل إلى الأرشيف" : "↩ أُرجع من الأرشيف"); }
  else if (e.target.closest("[data-note]")) openNote(j);
});
$("#wRows").addEventListener("change", e => { const f = e.target.closest("[data-fee]"); if (!f) return; const j = jobs.find(x => x.id === f.closest("[data-id]").dataset.id); j.fee = f.value.trim(); save();
  syncLedger(j).then(ok => { render(); if (ok) toast("💰 المبلغ رحل للسجل المالي"); }); });

/* ---------- الربط مع السجل المالي (سجل إسلام) ---------- */
const LG = { db: null, recs: [] };
const nn = x => String(x || "").replace(/\s+/g, " ").trim();
function lgLoad() { return new Promise(res => { try { const r = indexedDB.open("segl-aslam", 1);
  r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("customers", { keyPath: "id" }); d.createObjectStore("notes", { keyPath: "id" }); };
  r.onsuccess = () => { LG.db = r.result; const q = LG.db.transaction("customers", "readonly").objectStore("customers").getAll(); q.onsuccess = () => { LG.recs = q.result || []; res(); }; q.onerror = () => res(); };
  r.onerror = () => res(); } catch (e) { res(); } }); }
function lgPut(rec) { return new Promise(res => { if (!LG.db) return res(false); try { const tx = LG.db.transaction("customers", "readwrite"); tx.objectStore("customers").put(rec);
  tx.oncomplete = () => { const i = LG.recs.findIndex(x => x.id === rec.id); if (i >= 0) LG.recs[i] = rec; else LG.recs.push(rec); res(true); }; tx.onerror = () => res(false); } catch (e) { res(false); } }); }
const lgOfJob = j => LG.recs.find(r => r.jobId === j.id) || (j.lgId && LG.recs.find(r => r.id === j.lgId));
const catOf = w => /ترخيص/.test(w) ? "license" : /تفصيل/.test(w) ? "detailed" : /قيد/.test(w) ? "extract" : /مجدد/.test(w) ? "renew" : /اعتراض|مخطط عام|مخططات عامة/.test(w) ? "objection" : "private";
const paysOf = r => Array.isArray(r.pays) ? r.pays.slice() : (N(r.paid) > 0 ? [{ a: String(N(r.paid)), d: r.date || "" }] : []);
/* المبلغ المطلوب هنا = المبلغ المطلوب في السجل المالي (ينشئ المعاملة أو يحدّثها، ولا يمس الدفعات والتوزيع) */
async function syncLedger(j) {
  if (!LG.db) await lgLoad(); if (!LG.db) return false;
  let r = lgOfJob(j); if (!r && !N(j.fee)) return false;
  if (!r) r = LG.recs.find(x => !x.archived && !x.jobId && nn(x.name) && nn(x.name) === nn(j.name) && (!N(x.due) || N(x.due) === N(j.fee)));
  const rec = r ? { ...r } : { id: "job-" + j.id, category: catOf(j.work || ""), created: Date.now(), currency: "شيكل", date: ymd(new Date(j.t || Date.now())), pays: [], paid: "0", notes: "" };
  rec.jobId = j.id; rec.name = j.name || rec.name || "بدون اسم"; if (j.phone) rec.phone = j.phone; rec.due = String(N(j.fee)); if (!rec.notes && j.work) rec.notes = j.work;
  j.lgId = rec.id; save(); return lgPut(rec);
}
/* الحالة: «سُلّم واستُلم المبلغ» يسجّل دفعة بالمتبقي في السجل المالي (وتُلغى لو رجعت عن الحالة) */
async function setStatus(j, st) {
  const was = j.s; if (was === st) return; j.s = st; j.done = st === "done" || st === "paid"; j.doneAt = j.done ? (j.doneAt || Date.now()) : null; save(); render();
  if (!LG.db) await lgLoad(); const r = lgOfJob(j);
  if (st === "paid" && r) { const rem = N(r.due) - N(r.paid); if (rem > 0) { const p = { a: String(rem), d: ymd(new Date()), auto: j.id }, pays = paysOf(r).concat(p);
      await lgPut({ ...r, pays, paid: String(pays.reduce((t, x) => t + N(x.a), 0)) }); j.autoPay = 1; save(); render(); toast(`✓ سُلّم العمل، وسُجّل استلام ${M(rem)} ₪ بالسجل المالي`); return; } }
  if (was === "paid" && j.autoPay && r) { const pays = paysOf(r).filter(x => x.auto !== j.id); await lgPut({ ...r, pays, paid: String(pays.reduce((t, x) => t + N(x.a), 0)) }); j.autoPay = 0; save(); render(); toast("أُلغيت دفعة الاستلام من السجل المالي"); return; }
  toast(STS.find(x => x[0] === st)[1]);
}
lgLoad().then(() => render());

/* ---------- صفحة الملاحظات ---------- */
let nJob = null;
function setDay(d) { document.querySelectorAll("#nDays .dayb").forEach(b => b.classList.toggle("on", b.dataset.d === d)); }
function contact() { const p = $("#nPhone").value.replace(/[^\d+]/g, ""), w = p.startsWith("0") ? "970" + p.slice(1) : p.replace(/^\+/, ""); $("#nCall").href = p ? "tel:" + p : "#"; $("#nWa").href = p ? "https://wa.me/" + w : "#"; $("#nCall").style.opacity = $("#nWa").style.opacity = p ? 1 : .4; }
function openNote(j) {
  nJob = j; $("#nT").textContent = "📝 " + (j.name || "ملاحظات");
  $("#nName").value = j.name || ""; $("#nWork").value = j.work || ""; $("#nPhone").value = j.phone || ""; $("#nDate").value = j.date || ""; $("#nTime").value = j.time || ""; $("#nNote").value = j.note || "";
  setDay(null); contact(); $("#noteSheet").classList.remove("hidden");
}
$("#nPhone").addEventListener("input", contact);
$("#nDays").addEventListener("click", e => { const b = e.target.closest("[data-d]"); if (!b) return; setDay(b.dataset.d); $("#nDate").value = b.dataset.d === "" ? "" : ymd(new Date(Date.now() + 864e5 * +b.dataset.d)); if (b.dataset.d === "") $("#nTime").value = ""; });
$("#nSave").addEventListener("click", () => {
  Object.assign(nJob, { name: $("#nName").value.trim(), work: $("#nWork").value.trim(), phone: $("#nPhone").value.trim(), date: $("#nDate").value, time: $("#nTime").value, note: $("#nNote").value.trim() });
  save(); $("#noteSheet").classList.add("hidden"); render(); toast("حُفظ"); if (lgOfJob(nJob)) syncLedger(nJob).then(() => render());
});
let delAsk = 0;
$("#nDel").addEventListener("click", () => { if (Date.now() - delAsk > 3000) { delAsk = Date.now(); toast("اضغط مرة ثانية للحذف النهائي"); return; } jobs = jobs.filter(x => x !== nJob); save(); $("#noteSheet").classList.add("hidden"); render(); toast("حُذف"); });

/* ---------- إغلاق الصفحات الداخلية ---------- */
const SHEETS = ["noteSheet"];
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => $("#" + b.dataset.close).classList.add("hidden")));
SHEETS.forEach(id => $("#" + id).addEventListener("click", e => { if (e.target.id === id) e.target.classList.add("hidden"); }));
window.__back = () => { for (const id of SHEETS) if (!$("#" + id).classList.contains("hidden")) { $("#" + id).classList.add("hidden"); return 1; } return 0; };

/* ---------- الإدخال الصوتي ---------- */
const voiceCb = {}; let vSeq = 0;
window.onNativeVoice = (id, text) => { const cb = voiceCb[id]; delete voiceCb[id]; if (cb) cb(text); };
window.onNativeVoiceError = (id, err) => { const cb = voiceCb[id]; delete voiceCb[id]; if (cb) cb(null, err); };
function listen(cb) {
  if (window.AndroidBridge && AndroidBridge.startVoice) { const id = "n" + (++vSeq); voiceCb[id] = cb; try { AndroidBridge.startVoice(id); } catch (e) { delete voiceCb[id]; cb(null, "error"); } return; }
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) { cb(null, "unavailable"); return; }
  const r = new R(); r.lang = "ar-JO"; r.onresult = e => cb(e.results[0][0].transcript); r.onerror = () => cb(null, "error"); r.start();
}
const AR_NUM = { "صفر": "0", "واحد": "1", "اثنين": "2", "اثنان": "2", "ثلاثة": "3", "ثلاث": "3", "اربعة": "4", "أربعة": "4", "خمسة": "5", "خمس": "5", "ستة": "6", "ست": "6", "سبعة": "7", "سبع": "7", "ثمانية": "8", "ثمان": "8", "تسعة": "9", "تسع": "9" };
const NUMF = new Set(["nPhone", "qFee"]);
function micTo(b, f, numeric) {
  b.classList.add("on");
  listen((text, err) => {
    b.classList.remove("on");
    if (text == null) { if (err === "unavailable") toast("الإدخال الصوتي غير متوفر على هذا الجوال"); return; }
    if (numeric) {
      const ph = f.id === "nPhone", digits = text.split(/\s+/).map(w => AR_NUM[w] || w).join("").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(ph ? /[^\d+]/g : /[^\d.]/g, "");
      if (digits) f.value = digits; else toast("لم أسمع أرقاماً، حاول مرة ثانية");
    } else f.value = (f.value && f.tagName === "TEXTAREA" ? f.value + " " : "") + text.trim();
    f.dispatchEvent(new Event("input", { bubbles: true }));
  });
}
document.querySelectorAll("[data-mic]").forEach(b => b.addEventListener("click", () => micTo(b, $("#" + b.dataset.mic), NUMF.has(b.dataset.mic))));
render();
</script>
