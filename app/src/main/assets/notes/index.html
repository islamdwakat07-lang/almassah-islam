<!doctype html>
<html lang="ar" dir="rtl" data-tool="notes">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر الملاحظات</title>
<link rel="stylesheet" href="../ifraz/fonts.css">
<link rel="stylesheet" href="../theme.css">
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif;background:#f8f2e2;color:var(--am-ink)}
main{max-width:600px;margin:0 auto;padding:12px 14px 120px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.tab{border:0;border-radius:16px;padding:10px 4px;background:#fffdf6;box-shadow:inset 0 0 0 1.5px var(--am-line);color:var(--am-green-800);font:700 15px "IBM Plex Sans Arabic"}
.tab b{display:block;font:700 24px/1.2 var(--am-title)}
.tab.on{background:linear-gradient(160deg,#17613f,#0c3b26);color:#fff6d6;box-shadow:0 0 0 2px var(--am-gold-400)}
.tab.on b{color:#f3dc93}
.list{display:flex;flex-direction:column;gap:10px}
.job{background:#fffdf6;border-radius:18px;padding:12px 14px;box-shadow:inset 0 0 0 1.5px var(--am-line),0 10px 20px -18px rgba(8,42,27,.6);border-right:7px solid var(--c)}
.job .top{display:flex;align-items:flex-start;gap:8px;cursor:pointer}
.job .nm{font:700 19px/1.4 "IBM Plex Sans Arabic";flex:1}
.job .wk{font-size:16px;color:#3a4a40;margin-top:2px}
.job .dt{flex:none;font:700 13px "IBM Plex Sans Arabic";padding:3px 10px;border-radius:999px;background:#eef3ec;color:#1e6b4a;white-space:nowrap}
.job .dt.late{background:#fbe3df;color:#a0302a}
.job .dt.today{background:#fbf0d2;color:#8a5a00}
.job .acts{display:flex;gap:8px;margin-top:10px;align-items:center}
.go{flex:1;border:0;border-radius:14px;padding:12px;font:700 17px "IBM Plex Sans Arabic";color:#fff;background:var(--am-btn);box-shadow:0 0 0 1.5px var(--am-gold-400)}
.go.done{background:linear-gradient(160deg,#2f8a4f,#1e6b4a)}
.go.back{flex:none;background:#fffaf0;color:var(--am-green-800);box-shadow:inset 0 0 0 1.5px var(--am-gold-500);font-size:14px;padding:10px 14px}
.ib{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#f3ead2;font-size:21px;text-decoration:none;border:0}
.empty{text-align:center;color:var(--am-muted);padding:34px 10px;font-size:16px}
.empty b{display:block;font:700 19px var(--am-title);color:var(--am-green-800);margin-bottom:4px}
.add{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:999px;padding:15px 30px;font:700 19px "IBM Plex Sans Arabic";color:#fff;
  background:var(--am-btn);box-shadow:0 0 0 2px var(--am-gold-400),0 14px 24px -10px rgba(8,42,27,.8);white-space:nowrap}
/* نافذة الإدخال */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,30,20,.45);display:flex;align-items:flex-end;justify-content:center}
.form{width:100%;max-width:600px;background:#fbf6e8;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25);max-height:92vh;overflow:auto}
.form h3{margin:0 0 12px;font:700 20px var(--am-title);color:var(--am-green-800);display:flex;align-items:center}
.form h3 .x{margin-inline-start:auto;border:0;background:#f3ead2;border-radius:50%;width:36px;height:36px;font-size:16px;color:#8a3b12}
.fl{display:block;font:700 15px "IBM Plex Sans Arabic";color:var(--am-green-800);margin:10px 2px 5px}
.in{display:flex;gap:8px}
.in input,.in textarea{flex:1;min-width:0;font:500 18px "IBM Plex Sans Arabic";padding:12px 14px;border:1.5px solid var(--am-line);border-radius:14px;background:#fffdf6;color:var(--am-ink)}
.in textarea{min-height:52px;resize:none;line-height:1.5}
.in input:focus,.in textarea:focus{outline:2px solid var(--am-gold-500);outline-offset:1px}
.mic{flex:none;width:54px;border:0;border-radius:14px;font-size:24px;color:#fff;background:linear-gradient(160deg,#c0392b,#8e1f16);box-shadow:0 6px 12px -6px rgba(140,30,20,.7)}
.mic.on{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.days{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.day{border:1.5px solid var(--am-line);background:#fffdf6;border-radius:999px;padding:6px 14px;font:700 14px "IBM Plex Sans Arabic";color:var(--am-green-800)}
.day.on{background:var(--am-btn);color:#fff;border-color:transparent}
.save{width:100%;margin-top:16px;border:0;border-radius:16px;padding:14px;font:700 19px "IBM Plex Sans Arabic";color:#fff;background:var(--am-btn);box-shadow:0 0 0 1.5px var(--am-gold-400)}
.del{width:100%;margin-top:8px;border:0;border-radius:14px;padding:10px;font:700 15px "IBM Plex Sans Arabic";color:#a0302a;background:transparent}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0c3b26;color:#fff6d6;padding:9px 18px;border-radius:999px;font-size:15px;z-index:90;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="am-bar"><span class="am-title"><img src="../img/t-notes.png" alt=""><b>دفتر الملاحظات</b></span><a class="am-home" href="../home.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2.5 11h2.7v9.5h5.3v-6h3v6h5.3V11h2.7z"/></svg>الرئيسية</a></div>
<div class="am-spacer" aria-hidden="true"></div>
<main>
  <div class="tabs" id="tabs">
    <button class="tab on" type="button" data-s="new"><b id="cNew">0</b>📅 القادم</button>
    <button class="tab" type="button" data-s="work"><b id="cWork">0</b>⏳ قيد العمل</button>
    <button class="tab" type="button" data-s="done"><b id="cDone">0</b>✅ منجز</button>
  </div>
  <div class="list" id="list"></div>
</main>
<button class="add" type="button" id="add">＋ عمل جديد</button>

<div class="sheet hidden" id="sheet">
  <div class="form">
    <h3 id="fT">عمل جديد<button class="x" type="button" id="fX">✕</button></h3>
    <label class="fl" for="fName">👤 الاسم</label>
    <div class="in"><input id="fName" placeholder="اكتب أو اضغط الميكروفون"><button class="mic" type="button" data-mic="fName">🎤</button></div>
    <label class="fl" for="fWork">🛠️ طبيعة العمل</label>
    <div class="in"><textarea id="fWork" rows="2" placeholder="مثلاً: رفع قطعة وترخيص"></textarea><button class="mic" type="button" data-mic="fWork">🎤</button></div>
    <label class="fl" for="fPhone">📞 رقم الهاتف</label>
    <div class="in"><input id="fPhone" inputmode="tel" dir="ltr" placeholder="05XXXXXXXX" style="text-align:left"><button class="mic" type="button" data-mic="fPhone">🎤</button></div>
    <label class="fl">🗓️ الموعد</label>
    <div class="days" id="days"><button class="day" type="button" data-d="0">اليوم</button><button class="day" type="button" data-d="1">غداً</button><button class="day" type="button" data-d="2">بعد غد</button><button class="day" type="button" data-d="">بدون موعد</button></div>
    <div class="in"><input id="fDate" type="date"><input id="fTime" type="time" style="max-width:40%"></div>
    <button class="save" type="button" id="fSave">حفظ</button>
    <button class="del hidden" type="button" id="fDel">🗑 حذف هذا العمل</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = t => { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 1800); };
const KEY = "jobs-v1";
let jobs = []; try { jobs = JSON.parse(localStorage.getItem(KEY) || "[]") || []; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(jobs)); } catch (e) {} };
let tab = "new", edit = null;
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const NEXT = { new: ["▶ بدء العمل", "work"], work: ["✓ تم الإنجاز", "done"] };
const COLOR = { new: "#1d4f9a", work: "#c58a12", done: "#2f8a4f" };

function when(j) {
  if (!j.date) return null;
  const today = ymd(new Date()), tm = ymd(new Date(Date.now() + 864e5));
  const t = j.time ? " " + new Date("2000-01-01T" + j.time).toLocaleTimeString("ar-EG", { hour: "numeric", minute: "2-digit" }) : "";
  if (j.date === today) return { t: "اليوم" + t, c: "today" };
  if (j.date === tm) return { t: "غداً" + t, c: "" };
  const d = new Date(j.date + "T00:00");
  const s = d.toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long" }) + t;
  return { t: s, c: j.date < today && j.s !== "done" ? "late" : "" };
}
function render() {
  $("#cNew").textContent = jobs.filter(j => j.s === "new").length;
  $("#cWork").textContent = jobs.filter(j => j.s === "work").length;
  $("#cDone").textContent = jobs.filter(j => j.s === "done").length;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.s === tab));
  let list = jobs.filter(j => j.s === tab);
  if (tab === "done") list.sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  else list.sort((a, b) => ((a.date || "9999") + (a.time || "")).localeCompare((b.date || "9999") + (b.time || "")));
  if (!list.length) {
    $("#list").innerHTML = `<div class="empty"><b>${tab === "new" ? "لا مواعيد قادمة" : tab === "work" ? "لا أعمال قيد التنفيذ" : "لا أعمال منجزة بعد"}</b>${tab === "new" ? "اضغط «＋ عمل جديد» وسجّل الاسم وطبيعة العمل بصوتك." : ""}</div>`;
    return;
  }
  $("#list").innerHTML = list.map(j => {
    const w = when(j), ph = (j.phone || "").replace(/[^\d+]/g, ""), wa = ph.startsWith("0") ? "970" + ph.slice(1) : ph.replace(/^\+/, "");
    const late = w && w.c === "late" ? " · فات الموعد" : "";
    return `<div class="job" style="--c:${COLOR[j.s]}">
      <div class="top" data-edit="${j.id}"><div style="flex:1;min-width:0"><div class="nm">${esc(j.name || "بدون اسم")}</div>${j.work ? `<div class="wk">${esc(j.work)}</div>` : ""}</div>${w ? `<span class="dt ${w.c}">${esc(w.t + late)}</span>` : ""}</div>
      <div class="acts">${NEXT[j.s] ? `<button class="go${j.s === "work" ? " done" : ""}" type="button" data-next="${j.id}">${NEXT[j.s][0]}</button>` : `<button class="go back" type="button" data-undo="${j.id}">↺ إرجاع لقيد العمل</button><span style="flex:1"></span>`}
      ${ph ? `<a class="ib" href="tel:${ph}" title="اتصال">📞</a><a class="ib" href="https://wa.me/${wa}" title="واتساب">💬</a>` : ""}</div></div>`;
  }).join("");
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (b) { tab = b.dataset.s; render(); } });
$("#list").addEventListener("click", e => {
  const n = e.target.closest("[data-next]");
  if (n) { const j = jobs.find(x => x.id === n.dataset.next); const to = NEXT[j.s][1]; j.s = to; if (to === "done") j.doneAt = Date.now(); save(); render(); toast(to === "work" ? "⏳ نُقل إلى قيد العمل" : "✅ نُقل إلى المنجز"); return; }
  const u = e.target.closest("[data-undo]");
  if (u) { const j = jobs.find(x => x.id === u.dataset.undo); j.s = "work"; save(); render(); toast("أُرجع إلى قيد العمل"); return; }
  const ed = e.target.closest("[data-edit]"); if (ed) openForm(jobs.find(x => x.id === ed.dataset.edit));
});

/* ---------- نافذة الإدخال ---------- */
function setDay(d) { document.querySelectorAll(".day").forEach(b => b.classList.toggle("on", b.dataset.d === d)); }
function openForm(j) {
  edit = j || null;
  $("#fT").firstChild.textContent = j ? "تعديل العمل" : "عمل جديد";
  $("#fName").value = j ? j.name || "" : ""; $("#fWork").value = j ? j.work || "" : ""; $("#fPhone").value = j ? j.phone || "" : "";
  $("#fDate").value = j ? j.date || "" : ""; $("#fTime").value = j ? j.time || "" : "";
  setDay(""); $("#fDel").classList.toggle("hidden", !j);
  $("#sheet").classList.remove("hidden");
}
const closeForm = () => { $("#sheet").classList.add("hidden"); edit = null; };
$("#add").addEventListener("click", () => openForm(null));
$("#fX").addEventListener("click", closeForm);
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeForm(); });
$("#days").addEventListener("click", e => { const b = e.target.closest("[data-d]"); if (!b) return; setDay(b.dataset.d); $("#fDate").value = b.dataset.d === "" ? "" : ymd(new Date(Date.now() + 864e5 * +b.dataset.d)); if (b.dataset.d === "") $("#fTime").value = ""; });
$("#fDate").addEventListener("input", () => setDay(null));
$("#fSave").addEventListener("click", () => {
  const name = $("#fName").value.trim(), work = $("#fWork").value.trim();
  if (!name && !work) { toast("اكتب الاسم أو طبيعة العمل"); return; }
  const d = { name, work, phone: $("#fPhone").value.trim(), date: $("#fDate").value, time: $("#fTime").value };
  if (edit) Object.assign(edit, d); else { jobs.push(Object.assign({ id: Date.now().toString(36), s: "new", t: Date.now() }, d)); tab = "new"; }
  save(); closeForm(); render(); toast("حُفظ");
});
let delAsk = 0;
$("#fDel").addEventListener("click", () => {
  if (Date.now() - delAsk > 3000) { delAsk = Date.now(); toast("اضغط مرة ثانية للحذف"); return; }
  jobs = jobs.filter(x => x !== edit); save(); closeForm(); render(); toast("حُذف");
});

/* ---------- الإدخال الصوتي (من نظام الجوال، بالعربية) ---------- */
const voiceCb = {}; let vSeq = 0;
window.onNativeVoice = (id, text) => { const cb = voiceCb[id]; delete voiceCb[id]; if (cb) cb(text); };
window.onNativeVoiceError = (id, err) => { const cb = voiceCb[id]; delete voiceCb[id]; if (cb) cb(null, err); };
function listen(cb) {
  if (window.AndroidBridge && AndroidBridge.startVoice) { const id = "n" + (++vSeq); voiceCb[id] = cb; try { AndroidBridge.startVoice(id); } catch (e) { delete voiceCb[id]; cb(null, "error"); } return; }
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) { cb(null, "unavailable"); return; }
  const r = new R(); r.lang = "ar-JO"; r.onresult = e => cb(e.results[0][0].transcript); r.onerror = () => cb(null, "error"); r.start();
}
const AR_NUM = { "صفر": "0", "واحد": "1", "اثنين": "2", "اثنان": "2", "ثلاثة": "3", "ثلاث": "3", "اربعة": "4", "أربعة": "4", "خمسة": "5", "خمس": "5", "ستة": "6", "ست": "6", "سبعة": "7", "سبع": "7", "ثمانية": "8", "ثمان": "8", "تسعة": "9", "تسع": "9" };
document.querySelectorAll("[data-mic]").forEach(b => b.addEventListener("click", () => {
  const f = $("#" + b.dataset.mic); b.classList.add("on");
  listen((text, err) => {
    b.classList.remove("on");
    if (text == null) { if (err === "unavailable") toast("الإدخال الصوتي غير متوفر على هذا الجوال"); return; }
    if (f.id === "fPhone") {
      const digits = text.split(/\s+/).map(w => AR_NUM[w] || w).join("").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^\d+]/g, "");
      f.value = digits || f.value; if (!digits) toast("لم أسمع أرقاماً، حاول مرة ثانية");
    } else f.value = (f.value ? f.value + " " : "") + text.trim();
  });
}));
window.__back = () => { if (!$("#sheet").classList.contains("hidden")) { closeForm(); return 1; } return 0; };
render();
</script>
</body>
</html>
