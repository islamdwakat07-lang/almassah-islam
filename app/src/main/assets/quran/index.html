<!doctype html>
<html lang="ar" dir="rtl" data-tool="quran">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المصحف الشريف</title>
<link rel="stylesheet" href="../ifraz/fonts.css">
<link rel="stylesheet" href="../theme.css">
<style>
@font-face{font-family:"Hafs";src:url("hafs.woff2") format("woff2");font-display:block}
@font-face{font-family:"Amiri Quran";src:url("amiri-quran.woff2") format("woff2");font-display:block}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif;background:#f8f2e2}
main{max-width:640px;margin:0 auto;padding:12px 14px 60px}
.hidden{display:none!important}
/* ---------- الفهرس ---------- */
.search{position:relative;margin:4px 0 12px}
.search input{width:100%;font:500 17px "IBM Plex Sans Arabic",Tahoma,sans-serif;padding:13px 46px 13px 14px;border:1.5px solid var(--am-line);border-radius:16px;background:#fffdf6;color:var(--am-ink)}
.search input:focus{outline:2px solid var(--am-gold-500);outline-offset:1px}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--am-green-800)}
.search .x{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:#f3ead2;color:#8a3b12;border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:right;border:0;border-radius:18px;padding:14px 16px;margin-bottom:10px;cursor:pointer;
  background:linear-gradient(160deg,#17613f,#0c3b26);color:#fff6d6;box-shadow:0 0 0 1.5px var(--am-gold-400),0 10px 20px -12px rgba(8,42,27,.8);font:inherit}
.resume b{font:700 18px var(--am-title);color:#f3dc93;display:block}
.resume small{opacity:.85}
.resume .go{margin-inline-start:auto;font-size:22px}
.gopage{display:flex;gap:8px;margin-bottom:12px}
.gopage input{flex:1;min-width:0;font:600 17px "IBM Plex Sans Arabic";padding:10px 12px;border:1.5px solid var(--am-line);border-radius:14px;background:#fffdf6;text-align:center}
.gopage button{border:0;border-radius:14px;padding:0 18px;font:700 15px "IBM Plex Sans Arabic";color:#fff;background:var(--am-btn);cursor:pointer}
.tabs{display:flex;border:1.5px solid var(--am-line);border-radius:999px;overflow:hidden;margin-bottom:12px;background:#fffdf6}
.tabs button{flex:1;border:0;background:none;padding:10px 6px;font:700 15px "IBM Plex Sans Arabic",Tahoma,sans-serif;color:var(--am-green-800);cursor:pointer}
.tabs button.on{background:var(--am-btn);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:12px;border:1px solid var(--am-line);border-radius:16px;background:#fffdf6;padding:10px 12px;cursor:pointer;text-align:right;width:100%;font:inherit;color:var(--am-ink)}
.it:active{background:#f6efd9}
.num{flex:none;width:42px;height:42px;display:grid;place-items:center;font:700 15px "IBM Plex Sans Arabic";color:#0c3b26;
  background:radial-gradient(circle,#fff8df 55%,transparent 56%),conic-gradient(from 22.5deg,#d6aa48 0 12.5%,#e9cf86 0 25%,#d6aa48 0 37.5%,#e9cf86 0 50%,#d6aa48 0 62.5%,#e9cf86 0 75%,#d6aa48 0 87.5%,#e9cf86 0);border-radius:50%}
.it .nm{font:400 25px/1.3 "Amiri Quran",serif;color:#0c3b26}
.it .meta{font-size:13px;color:var(--am-muted)}
.it .end{margin-inline-start:auto;font-size:13px;color:var(--am-muted);text-align:left;white-space:nowrap}
.bm .del{border:0;background:#f3ead2;color:#8a3b12;border-radius:50%;width:32px;height:32px;cursor:pointer;flex:none}
.res .ay{font:400 22px/2.1 "Hafs",serif;color:#1d2a22}
.res mark{background:#f6df8f;color:inherit;border-radius:4px}
.res .ref{font-size:13px;color:var(--am-green-800);font-weight:700}
.count{color:var(--am-muted);font-size:14px;margin:0 4px 8px}
.empty{color:var(--am-muted);text-align:center;padding:20px}
.more{display:block;margin:10px auto;border:1.5px solid var(--am-gold-500);border-radius:999px;padding:9px 18px;background:#fffaf0;color:var(--am-green-800);font:700 15px "IBM Plex Sans Arabic";cursor:pointer}
/* ---------- صفحة المصحف ---------- */
#reader{position:fixed;inset:calc(58px + env(safe-area-inset-top,0px)) 0 0 0;display:flex;flex-direction:column;align-items:center;background:#efe5c8;z-index:10;touch-action:pan-y}
.pgwrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;padding:6px}
.qbox{display:flex;justify-content:center;padding:4px 0}
.qz quran-madina-html{--qmh-background:#fffdf3;--qmh-header:#0c3b26;background:transparent;border-radius:0}
.qz quran-madina-html-header{display:none}
.qhl{background:#f6df8f!important;border-radius:4px}
quran-madina-html-aya-popup{direction:rtl}
quran-madina-html-aya-popup button{font:700 14px "IBM Plex Sans Arabic",Tahoma,sans-serif!important;padding:8px 12px!important;border-radius:999px!important;background:#f3dc93!important;color:#0c3b26!important;border:0!important;margin:3px!important}
.ph{display:flex;justify-content:space-between;font:400 15px/1 "Amiri Quran",serif;color:#7a5a12;padding:6px 8px 2px}
.pn{text-align:center;font:400 15px/1 "Amiri Quran",serif;color:#7a5a12;padding:10px 0 4px}
.pn span{border:1px solid #d9c48a;border-radius:999px;padding:3px 14px;background:#fff8df}
.pg{position:relative;background:#fffdf3;border-radius:6px;padding:10px 12px;box-shadow:0 0 0 1px #d9c48a,0 6px 18px -8px rgba(60,40,0,.45),inset 0 0 0 5px #fffdf3,inset 0 0 0 6.5px #c9a24a}
.pbar{display:flex;gap:8px;align-items:center;width:100%;max-width:520px;padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.rb{border:1.5px solid var(--am-gold-500);border-radius:999px;background:#fffaf0;color:var(--am-green-800);font:700 14px "IBM Plex Sans Arabic";padding:8px 12px;cursor:pointer;white-space:nowrap}
.rb:active{transform:scale(.96)}
.rb:disabled{opacity:.35}
.pbar .mid{flex:1;display:flex;gap:6px;justify-content:center}
.pbar input{width:64px;font:700 15px "IBM Plex Sans Arabic";text-align:center;border:1.5px solid var(--am-line);border-radius:999px;padding:7px 4px;background:#fffdf6}
.act{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;gap:8px;padding:8px;border-radius:999px;
  background:#0c3b26;box-shadow:0 0 0 2px #e6c35f,0 12px 26px -10px rgba(0,0,0,.6)}
.act button{border:0;border-radius:999px;padding:9px 14px;font:700 14px "IBM Plex Sans Arabic";background:#f3dc93;color:#0c3b26;cursor:pointer;white-space:nowrap}
.act .lbl{color:#f3dc93;font-size:13px;align-self:center;padding:0 6px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#0c3b26;color:#fff6d6;padding:9px 16px;border-radius:999px;font-size:14px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="am-bar"><span class="am-title"><img src="../img/t-quran.png" alt=""><b>المصحف الشريف</b></span><a class="am-home" href="../home.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2.5 11h2.7v9.5h5.3v-6h3v6h5.3V11h2.7z"/></svg>الرئيسية</a></div>
<div class="am-spacer" aria-hidden="true"></div>
<main id="idx">
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ابحث عن كلمة أو آية أو اسم سورة…" autocomplete="off" enterkeyhint="search">
    <button class="x hidden" id="qx" type="button" aria-label="مسح">✕</button>
  </div>
  <div id="home">
    <button class="resume hidden" id="resume" type="button"></button>
    <div class="gopage"><input id="gp" inputmode="numeric" placeholder="رقم الصفحة (١ – ٦٠٤)"><button type="button" id="gpGo">اذهب</button></div>
    <div class="tabs" role="tablist">
      <button type="button" data-tab="s" class="on">السور</button>
      <button type="button" data-tab="j">الأجزاء</button>
      <button type="button" data-tab="b">العلامات</button>
    </div>
    <div class="list" id="list"></div>
  </div>
  <div id="results" class="hidden"></div>
</main>

<section id="reader" class="hidden">
  <div class="pgwrap" id="pw"><div class="pg" id="pg"></div></div>
  <div class="pbar">
    <button class="rb" id="prevP" type="button">› السابقة</button>
    <div class="mid"><button class="rb" id="toIdx" type="button">الفهرس</button><input id="pnum" inputmode="numeric" aria-label="رقم الصفحة"></div>
    <button class="rb" id="nextP" type="button">التالية ‹</button>
  </div>
</section>
<div class="toast" id="toast"></div>
<script src="mushaf.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const M = window.MUSHAF, PAGES = M.pages, SUR = M.sur, KEY = "quran-v2";
const JUZ_NAMES = ["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي عشر","الثاني عشر","الثالث عشر","الرابع عشر","الخامس عشر","السادس عشر","السابع عشر","الثامن عشر","التاسع عشر","العشرون","الحادي والعشرون","الثاني والعشرون","الثالث والعشرون","الرابع والعشرون","الخامس والعشرون","السادس والعشرون","السابع والعشرون","الثامن والعشرون","التاسع والعشرون","الثلاثون"];
const AD = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const toNum = s => parseInt(String(s).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)), 10);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null") || {}; } catch (e) { return {}; } };
let st = Object.assign({ bm: [], last: 0 }, load());
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 1800); }

/* ---------- أرقام الآيات: رقم عام (٠–٦٢٣٥) ↔ سورة وآية ---------- */
function sa(g) { let lo = 0, hi = 113; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (SUR[m][3] <= g) lo = m; else hi = m - 1; } return [lo + 1, g - SUR[lo][3] + 1]; }
function juzOfA(g) { let j = 0; M.juzA.forEach((a, i) => { if (a <= g) j = i; }); return j + 1; }
const endsWithMark = p => { const rows = PAGES[p - 1].r; for (let i = rows.length - 1; i >= 0; i--) if (rows[i][0] === "l") return rows[i][1][rows[i][1].length - 1].charCodeAt(0) === 0x06DD; return true; };
function pageOfA(g) {   // الصفحة التي تبدأ فيها الآية
  let lo = 0, hi = 603; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (PAGES[m].a <= g) lo = m; else hi = m - 1; }
  let p = lo + 1; if (p > 1 && PAGES[p - 1].a === g && !endsWithMark(p - 1)) p--;
  return p;
}
let UTH = null;   // نص كل آية (لنتائج البحث والنسخ)
function uth() {
  if (UTH) return UTH; UTH = Array(6236).fill("");
  PAGES.forEach(pg => { let g = pg.a; pg.r.forEach(r => { if (r[0] !== "l") return; r[1].forEach(t => { if (t.charCodeAt(0) === 0x06DD) { g++; return; } UTH[g] += (UTH[g] ? " " : "") + t; }); }); });
  return UTH;
}

/* ---------- البحث ---------- */
const MARKS = /[ؐ-ًؚ-ٟۖ-ۭ࣓-ࣿـ]/g;
function norm(s) { return String(s).replace(/ٰ/g, "ا").replace(MARKS, "").replace(/[ٱأإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/ؤ/g, "و").replace(/ئ/g, "ي").replace(/ء/g, "").replace(/\s+/g, " ").trim(); }
let NIM = null, hits = [], shown = 0, qWords = [];
function search(q) {
  const nq = norm(q);
  if (nq.length < 2) { $("#results").classList.add("hidden"); $("#home").classList.remove("hidden"); return; }
  $("#home").classList.add("hidden"); $("#results").classList.remove("hidden");
  NIM = NIM || M.im.map(norm);
  qWords = nq.split(" ");
  const sur = SUR.map((s, i) => ({ i, n: norm(s[0]) })).filter(x => x.n.includes(nq) || String(x.i + 1) === nq);
  hits = []; NIM.forEach((t, g) => { if (t.includes(nq)) hits.push(g); });
  shown = 0; uth();
  let h = "";
  if (sur.length) h += '<p class="count">السور</p><div class="list" style="margin-bottom:14px">' + sur.slice(0, 8).map(x => surItem(x.i)).join("") + "</div>";
  h += `<p class="count">${hits.length ? "عدد الآيات: " + AD(hits.length) : ""}</p><div class="list res" id="rl"></div>`;
  if (!hits.length && !sur.length) h = '<p class="empty">لا توجد نتائج. جرّب كلمة أخرى أو جزءاً من الكلمة.</p>';
  $("#results").innerHTML = h; more();
}
const hlWords = t => t.split(" ").map(w => qWords.some(q => q && norm(w).includes(q)) ? "<mark>" + esc(w) + "</mark>" : esc(w)).join(" ");
function more() {
  const rl = $("#rl"); if (!rl) return;
  const part = hits.slice(shown, shown + 50); shown += part.length;
  rl.insertAdjacentHTML("beforeend", part.map(g => { const [s, a] = sa(g); return `<button class="it" type="button" data-ga="${g}" style="flex-direction:column;align-items:stretch"><span class="ref">${esc(SUR[s - 1][0])} – الآية ${AD(a)} · صفحة ${AD(pageOfA(g))}</span><span class="ay">${hlWords(UTH[g])}</span></button>`; }).join(""));
  const old = $("#moreB"); if (old) old.remove();
  if (shown < hits.length) $("#results").insertAdjacentHTML("beforeend", '<button class="more" id="moreB" type="button">عرض المزيد</button>');
}
let tmr = 0;
$("#q").addEventListener("input", () => { $("#qx").classList.toggle("hidden", !$("#q").value); clearTimeout(tmr); tmr = setTimeout(() => search($("#q").value), 250); });
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(tmr); search($("#q").value); $("#q").blur(); } });
$("#qx").addEventListener("click", () => { $("#q").value = ""; $("#qx").classList.add("hidden"); search(""); });
$("#results").addEventListener("click", e => { if (e.target.id === "moreB") more(); });

/* ---------- الفهرس ---------- */
function surItem(i) {
  const s = SUR[i];
  return `<button class="it" type="button" data-p="${s[4]}"><span class="num">${AD(i + 1)}</span><span><span class="nm">سورة ${esc(s[0])}</span><br><span class="meta">${s[1] === "m" ? "مكية" : "مدنية"} · ${AD(s[2])} آية</span></span><span class="end">صفحة ${AD(s[4])}</span></button>`;
}
let tab = "s";
function renderList() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  let h = "";
  if (tab === "s") h = SUR.map((s, i) => surItem(i)).join("");
  else if (tab === "j") h = M.juz.map((p, i) => { const [s, a] = sa(M.juzA[i]); return `<button class="it" type="button" data-p="${p}"><span class="num">${AD(i + 1)}</span><span><span class="nm">الجزء ${JUZ_NAMES[i]}</span><br><span class="meta">سورة ${esc(SUR[s - 1][0])} – الآية ${AD(a)}</span></span><span class="end">صفحة ${AD(p)}</span></button>`; }).join("");
  else h = st.bm.length ? st.bm.map((b, i) => { const [s, a] = sa(b.g); return `<div class="it bm" data-ga="${b.g}"><span class="num">🔖</span><span><span class="nm" style="font-size:21px">سورة ${esc(SUR[s - 1][0])}</span><br><span class="meta">الآية ${AD(a)} · صفحة ${AD(pageOfA(b.g))}</span></span><button class="del" type="button" data-del="${i}" aria-label="حذف">✕</button></div>`; }).join("") : '<p class="empty">لا توجد علامات بعد. اضغط على أي آية في الصفحة واختر «علامة».</p>';
  $("#list").innerHTML = h;
  if (st.last) { const g = PAGES[st.last - 1].a, [s] = sa(g); $("#resume").innerHTML = `<span><b>متابعة القراءة</b><small>صفحة ${AD(st.last)} · سورة ${esc(SUR[s - 1][0])} · الجزء ${AD(juzOfA(g))}</small></span><span class="go">‹</span>`; $("#resume").dataset.p = st.last; $("#resume").classList.remove("hidden"); }
  else $("#resume").classList.add("hidden");
}
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; renderList(); } });
$("#idx").addEventListener("click", e => {
  const d = e.target.closest("[data-del]");
  if (d) { st.bm.splice(+d.dataset.del, 1); save(); renderList(); return; }
  const ga = e.target.closest("[data-ga]"); if (ga) { const g = +ga.dataset.ga; openPage(pageOfA(g), g); return; }
  const p = e.target.closest("[data-p]"); if (p) openPage(+p.dataset.p);
});
function goTyped(inp) { const n = toNum(inp.value); if (n >= 1 && n <= 604) openPage(n); else toast("اكتب رقم صفحة من ١ إلى ٦٠٤"); }
$("#gpGo").addEventListener("click", () => goTyped($("#gp")));
$("#gp").addEventListener("keydown", e => { if (e.key === "Enter") goTyped($("#gp")); });

/* ---------- عرض الصفحة كما في المصحف المطبوع ---------- */
let cur = 1;
/* الصفحة بمكتبة quran-madina-html: أسطر مصحف المدينة ١٤٤١هـ، كل سطر مضبوط بعرض الصفحة بمدّ الحروف كما في المطبوع */
let qmhP = null, qtag = null;
function qmh() {
  if (qmhP) return qmhP;
  qmhP = new Promise(ok => {
    const availW = Math.min(innerWidth - 40, 560);
    const sc = document.createElement("script");
    sc.src = "qmh/dist/quran-madina-html.min.js"; sc.setAttribute("data-cdn", "qmh/"); sc.setAttribute("data-layout", "1441H");
    sc.setAttribute("data-font-size", String(Math.max(10, Math.min(40, Math.round(16 * availW / 262)))));
    sc.onload = () => customElements.whenDefined("quran-madina-html").then(() => {
      const C = customElements.get("quran-madina-html");
      C.clearActions();
      C.registerAction({ id: "bm", title: "🔖 علامة", order: 10, onSelect: a => addBm(a.sura, a.aya) });
      C.registerAction({ id: "cp", title: "نسخ الآية", order: 20, onSelect: a => copyAya(a.sura, a.aya) });
      ok();
    });
    document.head.appendChild(sc);
  });
  return qmhP;
}
function openPage(p, flashG) {
  cur = Math.max(1, Math.min(604, p));
  $("#idx").classList.add("hidden"); $("#reader").classList.remove("hidden");
  const g0 = PAGES[cur - 1].a, [s0] = sa(g0);
  const pg = $("#pg");
  if (!qtag) {
    pg.innerHTML = '<div class="ph"><span id="phS"></span><span id="phJ"></span></div><div class="qbox"><div class="qz" id="qz"><quran-madina-html id="qt" actions="bm cp"></quran-madina-html></div></div><div class="pn"><span id="phN"></span></div>';
    qtag = $("#qt");
  }
  $("#phS").textContent = "سورة " + SUR[s0 - 1][0]; $("#phJ").textContent = "الجزء " + JUZ_NAMES[juzOfA(g0) - 1]; $("#phN").textContent = AD(cur);
  $("#pnum").value = AD(cur); $("#prevP").disabled = cur === 1; $("#nextP").disabled = cur === 604;
  st.last = cur; save();
  const want = cur;
  qmh().then(() => {
    qtag.setAttribute("page", String(want));
    let n = 0; const wait = () => {   // انتظار انتهاء رسم الصفحة ثم ضبط الحجم
      if (cur !== want) return;
      if (qtag.querySelector(".quran-madina-html-part") || n++ > 60) { fit(); if (flashG != null) flash(flashG); }
      else setTimeout(wait, 50);
    };
    setTimeout(wait, 30);
  });
}
function flash(g) {
  const [s, a] = sa(g), cls = "quran-madina-html-" + String(s).padStart(3, "0") + "-" + String(a).padStart(3, "0");
  let els = qtag.getElementsByClassName(cls);
  if (!els.length) els = qtag.getElementsByClassName("quran-madina-html-" + String(s).padStart(3, "0") + "-" + String(a + 1).padStart(3, "0"));
  [...els].forEach(e => { e.classList.add("qhl"); setTimeout(() => e.classList.remove("qhl"), 2600); });
}
/* الصفحة تملأ الشاشة: تكبير أو تصغير الصفحة المرسومة كاملة */
function fit() {
  const pw = $("#pw"), pg = $("#pg"), qz = $("#qz"); if (!pw.clientWidth || !qz) return;
  qz.style.zoom = 1;
  const w = qtag.offsetWidth, h = qtag.offsetHeight; if (!w || !h) return;
  const padX = 24, extraH = 70;
  const z = Math.min((pw.clientWidth - 12 - padX) / w, (pw.clientHeight - 12 - extraH) / h);
  qz.style.zoom = z;
  pg.style.width = (w * z + padX) + "px";
}
addEventListener("resize", () => { if (!$("#reader").classList.contains("hidden")) fit(); });
function addBm(s, a) { const g = SUR[s - 1][3] + a - 1; if (!st.bm.some(b => b.g === g)) { st.bm.unshift({ g }); st.bm = st.bm.slice(0, 60); save(); } toast("حُفظت العلامة"); }
async function copyAya(s, a) {
  const g = SUR[s - 1][3] + a - 1, t = uth()[g] + " ﴿سورة " + SUR[s - 1][0] + " " + AD(a) + "﴾";
  try { if (window.AndroidBridge && AndroidBridge.copy) AndroidBridge.copy(t); else await navigator.clipboard.writeText(t); toast("نُسخت الآية"); } catch (e) { toast("تعذّر النسخ"); }
}
$("#prevP").addEventListener("click", () => cur > 1 && openPage(cur - 1));
$("#nextP").addEventListener("click", () => cur < 604 && openPage(cur + 1));
$("#pnum").addEventListener("keydown", e => { if (e.key === "Enter") { goTyped($("#pnum")); $("#pnum").blur(); } });
$("#pnum").addEventListener("change", () => goTyped($("#pnum")));
$("#toIdx").addEventListener("click", toIndex);
function toIndex() { $("#reader").classList.add("hidden"); $("#idx").classList.remove("hidden"); renderList(); scrollTo(0, 0); }
// السحب: من اليسار لليمين = الصفحة التالية (كما يُقلب المصحف)، والعكس = السابقة
let tx = 0, ty = 0, tt = 0;
$("#pw").addEventListener("touchstart", e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; tt = Date.now(); }, { passive: true });
$("#pw").addEventListener("touchend", e => {
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - tt < 800) { if (dx > 0 && cur < 604) openPage(cur + 1); else if (dx < 0 && cur > 1) openPage(cur - 1); }
}, { passive: true });
addEventListener("keydown", e => { if ($("#reader").classList.contains("hidden") || e.target.tagName === "INPUT") return; if (e.key === "ArrowLeft" && cur < 604) openPage(cur + 1); if (e.key === "ArrowRight" && cur > 1) openPage(cur - 1); });
window.__back = () => { const pop = document.querySelector("quran-madina-html-aya-popup.quran-madina-html-open"); if (pop) { pop.classList.remove("quran-madina-html-open"); return 1; } if (!$("#reader").classList.contains("hidden")) { toIndex(); return 1; } if ($("#q").value) { $("#q").value = ""; search(""); return 1; } return 0; };
renderList();
</script>
